<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Circle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Last Circle</title>
<style>
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/chakra-petch-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format("woff2")}
</style>
<style>
  :root{
    --bg:#08090d; --panel:#12141b; --panel2:#181b24; --line:#262a36; --text:#e4e1d8; --dim:#8a8796;
    --red:#ff5a3c; --yellow:#ffd23f; --blue:#4fc3ff; --green:#5ee08a; --gold:#f2c14e; --hp:#e5484d; --xp:#9b8cff; --steel:#c9cbd6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
  .hidden{display:none!important}
  .bars{width:min(260px,40vw)}
  .bar{height:12px;background:#1a1c24;border-radius:3px;overflow:hidden;position:relative;margin-bottom:6px;border:1px solid #2a2d3a}
  .bar i{position:absolute;inset:0 auto 0 0;display:block}
  .bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 2px #000}
  .wave{text-align:center;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
  .wave small{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em;font-size:12px;margin-top:2px}
  .wave.endless span{color:var(--red);animation:throb 1.2s infinite}
  @keyframes throb{50%{opacity:.55}}
  .goldbox{font-size:22px;font-weight:700;color:var(--gold);text-align:right;min-width:90px;white-space:nowrap}
  .goldbox::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-right:7px;box-shadow:0 0 8px var(--gold)}
  .slots{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
  .slot{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:rgba(18,20,27,.85);display:flex;align-items:center;justify-content:center;position:relative}
  .slot svg{width:24px;height:24px}
  .slot b{position:absolute;bottom:1px;right:4px;font-size:10px;color:var(--dim)}
  .audio{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:5}
  .audio button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;background:rgba(24,27,36,.9);color:var(--text);border:1px solid #343a4c;border-radius:6px;padding:6px 9px;cursor:pointer}
  .audio button.off{color:#5c5f6c;text-decoration:line-through}

  .screen{position:fixed;inset:0;display:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-items:center;justify-content:center;background:rgba(6,7,10,.82);backdrop-filter:blur(3px);padding:14px;overflow:auto;z-index:10}
  .screen.show{display:flex}
  .panel{width:min(1180px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  h1{font-size:44px;margin:0;letter-spacing:.18em;text-transform:uppercase;line-height:1}
  h1 em{font-style:normal;color:var(--red)}
  h2{margin:0;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
  h3{margin:16px 0 8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
  h3 span{text-transform:none;letter-spacing:.02em}
  .sub{color:var(--dim);margin:8px 0 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .card{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--c,#555);border-radius:8px;padding:12px;cursor:pointer;transition:transform .08s,border-color .08s;display:flex;flex-direction:column;gap:5px;text-align:left;color:inherit;font:inherit}
  .card:hover:not(.off){transform:translateY(-2px);border-color:var(--c,#888)}
  .card.off{opacity:.45;cursor:default}
  .card .t{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card .t .ic{display:flex;align-items:center;gap:8px}
  .card .t svg{width:20px;height:20px;flex-shrink:0}
  .card .el{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
  .card ul{margin:2px 0 0;padding-left:16px;font-size:13px;color:#c9c6bd;line-height:1.5}
  .card li.af{color:var(--steel);list-style:"◆ ";font-weight:600}
  .card .price{margin-top:auto;padding-top:6px;font-weight:700;color:var(--gold)}
  .card .key{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .prim{font-size:20px;font-weight:700;margin:4px 0 2px}
  .sec{font-size:14px;border-left:3px solid var(--c);padding:6px 9px;background:#11131a;border-radius:0 5px 5px 0;margin-top:6px}
  .sec small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
  .sec em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}
  .rare{font-size:10px;letter-spacing:.14em;color:#111;background:var(--gold);padding:2px 6px;border-radius:3px;font-weight:700}
  .btn{font:inherit;font-weight:600;background:#1f2330;color:var(--text);border:1px solid #343a4c;border-radius:6px;padding:8px 14px;cursor:pointer;letter-spacing:.04em}
  .btn:hover:not(:disabled){border-color:#7a8199}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.go{background:var(--red);border-color:var(--red);color:#120806;font-size:15px;padding:10px 20px;letter-spacing:.1em;text-transform:uppercase}
  .btn.go:hover{filter:brightness(1.1)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .gc{color:var(--gold)}
  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .shopgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
  .offers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .owned{display:flex;flex-direction:column;gap:6px}
  .wrow{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:14px}
  .wrow svg{width:18px;height:18px;flex-shrink:0}
  .wrow .n{flex:1;line-height:1.25}
  .wrow .n small{display:block;font-size:11px;color:var(--steel);opacity:.8}
  .wrow.empty{color:#4c4f5c;font-size:13px;padding:9px}
  .sets{display:grid;gap:8px}
  .sets.e4{grid-template-columns:repeat(4,1fr)}
  .sets.t5{grid-template-columns:repeat(5,1fr)}
  .rs{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.38}
  .rs .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--c);font-size:13px;margin-bottom:4px;letter-spacing:.05em}
  .rs .h span:first-child{display:flex;align-items:center;gap:6px}
  .rs .h svg{width:16px;height:16px}
  .rs .e{padding:5px 0;border-top:1px solid #20232d;color:#5f6272}
  .rs .e:first-of-type{border-top:0}
  .rs .e b{font-weight:600}
  .rs .e.on{color:#e4e1d8}
  .rs .e.on b{color:var(--c)}
  .rs.own{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 4%,transparent)),var(--panel2);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 18%,transparent)}
  .rs.own .e{border-top-color:color-mix(in srgb,var(--c) 18%,transparent)}
  .note{background:#1b1712;border:1px solid #4a3c1c;border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:12px}
  .note.endless{background:#1d1013;border-color:#5a2028;border-left-color:var(--red)}
  .pips{float:right;letter-spacing:1px;color:var(--c)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 12px;font-size:13px;color:#c9c6bd}
  .stats span b{color:var(--text)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap}
  .hint{color:var(--dim);font-size:13px}
  .center{text-align:center}
  .big{font-size:40px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:11px;padding:3px 7px;border-radius:4px;background:#1f2330;border:1px solid var(--line);border-left:3px solid var(--c)}
  @media (max-width:980px){
    .shopgrid{grid-template-columns:1fr}
    .sets.e4{grid-template-columns:1fr 1fr}
    .sets.t5{grid-template-columns:1fr 1fr 1fr}
    h1{font-size:32px}
    .panel{padding:14px}
    .stats{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){ .offers,.sets.e4,.sets.t5{grid-template-columns:1fr} }
  @media (max-width:640px){ .audio{bottom:auto;top:calc(48px + env(safe-area-inset-top))} .audio button{padding:4px 7px;font-size:11px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <div class="bars">
    <div class="bar"><i id="hpB" style="background:var(--hp)"></i><span id="hpT"></span></div>
    <div class="bar" style="height:9px"><i id="xpB" style="background:var(--xp)"></i><span id="xpT" style="font-size:9px;line-height:8px"></span></div>
  </div>
  <div class="wave" id="waveBox"><span id="waveT"></span><small id="leftT"></small></div>
  <div class="goldbox" id="goldT">0</div>
</div>
<div class="slots hidden" id="slots"></div>
<div class="audio"><button id="musBtn" title="Toggle music (M)">♪ Music</button><button id="sfxBtn" title="Toggle sound effects (N)">SFX</button></div>
<div class="screen" id="screen"></div>

<script>
(() => {
"use strict";
// =====================================================================
//  AUDIO — everything is synthesised with WebAudio, no files
// =====================================================================
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const AU = {
  ctx: null, on: { music: true, sfx: true }, last: {}, mode: null, step: 0, nextT: 0, voices: 0, wave: 1,
  load() { try { const s = JSON.parse(localStorage.getItem('lcAudio') || 'null'); if (s) this.on = s; } catch (e) {} },
  save() { try { localStorage.setItem('lcAudio', JSON.stringify(this.on)); } catch (e) {} },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 6; this.comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = .85; this.master.connect(this.comp);
    this.sfx = c.createGain(); this.sfx.gain.value = this.on.sfx ? .6 : 0; this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = this.on.music ? .32 : 0; this.mus.connect(this.master);
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    this.delay = c.createDelay(1); this.delay.delayTime.value = .33;
    const fb = c.createGain(); fb.gain.value = .35; this.delay.connect(fb); fb.connect(this.delay);
    const wet = c.createGain(); wet.gain.value = .4; this.delay.connect(wet); wet.connect(this.mus);
    this.nextT = c.currentTime + .1;
    setInterval(() => this.schedule(), 25);
  },
  setOn(k, v) {
    this.on[k] = v; this.save();
    if (this.ctx) (k === 'music' ? this.mus : this.sfx).gain.setTargetAtTime(v ? (k === 'music' ? .32 : .6) : 0, this.ctx.currentTime, .05);
  },
  // --- primitives
  tone(f, dur, o = {}) {
    const c = this.ctx, t = o.at || c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol || .2, a = o.a || .004;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    let node = osc;
    if (o.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; f2.Q.value = o.q || 1; node.connect(f2); node = f2; }
    node.connect(g); g.connect(o.dest || this.sfx);
    if (o.send) g.connect(this.delay);
    osc.start(t); osc.stop(t + dur + .02);
  },
  noise(dur, o = {}) {
    const c = this.ctx, t = o.at || c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = c.createGain(), v = o.vol || .2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + (o.a || .003)); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * .5); src.stop(t + dur + .02);
  },
  // --- sound effects (throttled so hundreds of hits don't turn into mush)
  play(name, p = 1) {
    if (!this.ctx || !this.on.sfx) return;
    const now = this.ctx.currentTime, gap = { swing: .07, hit_red: .05, hit_blue: .05, hit_yellow: .05, hit_green: .05, boom: .06, zap: .05, freeze: .08, coin: .06, xp: .045, thorn: .07, rumble: .08, pop: .04, summon: .12, burn: .25 }[name] || 0;
    if (gap && now - (this.last[name] || 0) < gap) return;
    this.last[name] = now;
    const T = this.tone.bind(this), N = this.noise.bind(this);
    switch (name) {
      case 'swing': N(.08, { ft: 'bandpass', f: 1400, to: 500, q: 1.5, vol: .05 }); break;
      case 'hit_red': N(.08, { f: 900, vol: .1 }); T(150, .07, { vol: .08, to: 80 }); break;
      case 'hit_blue': T(1800 + Math.random() * 400, .06, { type: 'triangle', vol: .05 }); T(2700, .04, { vol: .03 }); break;
      case 'hit_yellow': T(1000, .05, { type: 'square', to: 300, vol: .03 }); break;
      case 'hit_green': T(330, .08, { type: 'triangle', vol: .06, to: 260 }); break;
      case 'boom': N(.35 * p, { f: 700, to: 90, vol: .22 * p }); T(110, .3 * p, { vol: .28 * p, to: 35 }); break;
      case 'zap': T(1300 + Math.random() * 500, .12, { type: 'sawtooth', to: 180, vol: .05, lp: 4000 }); N(.06, { ft: 'highpass', f: 3000, vol: .08 }); break;
      case 'freeze': [0, .03, .06].forEach((d, i) => T(1500 + i * 520, .14, { type: 'triangle', vol: .04, at: this.ctx.currentTime + d })); break;
      case 'rumble': N(.5 * p, { f: 260, to: 70, vol: .2 * Math.min(1.5, p) }); T(62, .45 * p, { vol: .22 * Math.min(1.5, p), to: 38 }); break;
      case 'thorn': T(1500, .05, { type: 'square', vol: .025, to: 700 }); N(.05, { ft: 'highpass', f: 4000, vol: .05 }); break;
      case 'xp': T(900 + Math.random() * 300, .05, { type: 'triangle', vol: .025 }); break;
      case 'coin': T(1320, .05, { vol: .035 }); T(1760, .06, { vol: .03, at: now + .045 }); break;
      case 'pop': T(420, .06, { vol: .04, to: 110 }); break;
      case 'burn': N(.25, { f: 2500, ft: 'bandpass', vol: .04 }); break;
      case 'summon': T(480, .09, { vol: .05, to: 900, type: 'triangle' }); break;
      case 'hurt': T(170, .16, { type: 'square', to: 60, vol: .12, lp: 900 }); N(.1, { f: 600, vol: .12 }); break;
      case 'level': [69, 72, 76, 81].forEach((m, i) => T(mtof(m), .18, { type: 'triangle', vol: .08, at: now + i * .07, send: true })); break;
      case 'buy': T(880, .06, { vol: .06 }); T(1320, .1, { vol: .05, at: now + .06 }); break;
      case 'click': T(700, .03, { vol: .04 }); break;
      case 'whoosh': N(.3, { ft: 'bandpass', f: 300, to: 1600, q: 2, vol: .1 }); break;
      case 'flame': N(.9, { f: 1600, to: 600, vol: .09, a: .05 }); break;
      case 'gust': N(.45, { ft: 'bandpass', f: 700, to: 2600, q: 1.2, vol: .1, a: .05 }); break;
      case 'snap': N(.5, { ft: 'highpass', f: 2000, vol: .1 }); [88, 91, 95].forEach((m, i) => T(mtof(m), .4, { type: 'triangle', vol: .04, at: now + i * .02 })); break;
      case 'revive': T(200, .7, { type: 'sawtooth', to: 900, vol: .1, lp: 2500 }); N(.6, { f: 600, to: 3000, vol: .08 }); break;
      case 'wave': T(110, .7, { type: 'sawtooth', vol: .07, lp: 700, a: .05 }); T(165, .7, { type: 'sawtooth', vol: .05, lp: 700, a: .05 }); break;
      case 'boss': [55, 58].forEach(m => T(mtof(m - 12), 1.6, { type: 'sawtooth', vol: .12, lp: 500, a: .1 })); N(1.4, { f: 200, to: 1200, vol: .1, a: .3 }); break;
      case 'endless': T(mtof(33), 2.2, { type: 'sawtooth', vol: .1, lp: 300, a: .3 }); T(mtof(34), 2.2, { type: 'sawtooth', vol: .1, lp: 300, a: .3 }); N(2, { ft: 'bandpass', f: 4000, to: 300, vol: .06, a: .8 }); break;
      case 'death': T(220, 1.4, { type: 'sawtooth', to: 40, vol: .12, lp: 1200 }); N(1, { f: 400, to: 60, vol: .1 }); break;
    }
  },
  // --- music
  setMode(m) {
    if (m === this.mode) return;
    this.mode = m; this.step = 0;
    if (this.ctx) this.nextT = Math.max(this.nextT, this.ctx.currentTime + .05);
  },
  bpm() { return { calm: 76, fight: 112, boss: 142, endless: Math.min(150, 98 + (this.wave - 21) * 4) }[this.mode] || 100; },
  schedule() {
    if (!this.ctx || !this.mode) return;
    while (this.nextT < this.ctx.currentTime + .15) {
      if (this.on.music) this.playStep(this.step, this.nextT);
      this.nextT += 60 / this.bpm() / 4; this.step++;
    }
  },
  kick(t, v = .5) { this.tone(150, .22, { to: 40, vol: v, at: t, dest: this.mus }); },
  snare(t, v = .18) { this.noise(.14, { ft: 'bandpass', f: 1800, q: .8, vol: v, at: t, dest: this.mus }); this.tone(220, .08, { vol: v * .5, at: t, dest: this.mus, to: 140 }); },
  hat(t, v = .05) { this.noise(.04, { ft: 'highpass', f: 7000, vol: v, at: t, dest: this.mus }); },
  playStep(s, t) {
    const M = this.mus, b = s % 16, bar = Math.floor(s / 16), T = this.tone.bind(this);
    if (this.mode === 'calm') {
      const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]][bar % 4];
      if (b === 0) prog.forEach(m => T(mtof(m - 12), 3.4, { type: 'triangle', vol: .05, a: .8, at: t, dest: M, lp: 1200 }));
      if (b % 2 === 0 && Math.random() < .55) T(mtof(pick(prog) + 12), .5, { vol: .035, at: t, dest: M, send: true });
    } else if (this.mode === 'fight') {
      const root = [45, 41, 43, 40][bar % 4], chord = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]][bar % 4];
      if (b === 0 || b === 8 || (b === 10 && bar % 2)) this.kick(t, .45);
      if (b === 4 || b === 12) this.snare(t);
      if (b % 2 === 1) this.hat(t);
      if ([0, 3, 6, 8, 11, 14].includes(b)) T(mtof(root - 12), .2, { type: 'sawtooth', vol: .1, at: t, dest: M, lp: 500, q: 4 });
      if (b % 2 === 0) T(mtof(chord[(b / 2) % 3] + 12), .14, { type: 'square', vol: .02, at: t, dest: M, lp: 2200, send: true });
      if (b === 0) chord.forEach(m => T(mtof(m), 2, { type: 'triangle', vol: .025, a: .4, at: t, dest: M }));
    } else if (this.mode === 'boss') {
      const root = [45, 46, 45, 40][bar % 4];
      if (b % 4 === 0) this.kick(t, .55);
      if (b === 4 || b === 12) this.snare(t, .22);
      this.hat(t, b % 2 ? .05 : .03);
      T(mtof(root - 12 + (b % 2 ? 12 : 0)), .12, { type: 'square', vol: .07, at: t, dest: M, lp: 900, q: 6 });
      if (b === 0 || b === 6 || b === 10) [0, 3, 7].forEach(i => T(mtof(root + 12 + i), .16, { type: 'sawtooth', vol: .035, at: t, dest: M, lp: 2500 }));
      if (b === 0 && bar % 4 === 3) this.noise(1.6, { ft: 'bandpass', f: 400, to: 5000, vol: .07, a: 1.4, at: t, dest: M });
    } else if (this.mode === 'endless') {
      const n = this.wave - 20;
      // heartbeat
      if (b === 0) this.kick(t, .6);
      if (b === 2) this.kick(t, .4);
      if (n >= 3 && (b === 8)) this.kick(t, .5);
      if (n >= 3 && (b === 10)) this.kick(t, .3);
      // clock tick
      if (b % 4 === 0) T(3200, .02, { type: 'square', vol: .02, at: t, dest: M });
      if (n >= 2 && b % 2 === 1) this.hat(t, .03);
      if (n >= 5) this.hat(t, .02);
      // dissonant drone every bar
      if (b === 0) { T(mtof(33), 2.6, { type: 'sawtooth', vol: .06, a: .6, at: t, dest: M, lp: 260 }); T(mtof(34), 2.6, { type: 'sawtooth', vol: .05, a: .6, at: t, dest: M, lp: 260 }); }
      // tritone pulse
      if (b % 8 === 0) T(mtof(b === 0 ? 45 : 51) - 0, .4, { type: 'square', vol: .05, at: t, dest: M, lp: 700, q: 8 });
      // glassy diminished notes, echoed
      if (b % 2 === 0 && Math.random() < .2 + Math.min(.3, n * .03)) T(mtof(pick([81, 84, 87, 90, 93])), .7, { vol: .03, at: t, dest: M, send: true });
      if (b === 0 && bar % 4 === 3) this.noise(2.2, { ft: 'bandpass', f: 200, to: 6000, vol: .06, a: 2, at: t, dest: M });
    }
  },
};

function strike(w, e, dir) {

    const sh = setv('blue', 'shards');
    if (sh && Math.random() * 100 < sh) {
      const n = setv('blue', 'shards', 'n');
      for (let i = 0; i < n; i++) { const a = dir + (i - (n - 1) / 2) * .22; S.projs.push({ kind: 'shard', x: S.p.x, y: S.p.y, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, life: .5, dmg: d * .5, hit: new Set() }); }
    }

}

// ---- sprouts

function sproutContact(s, e, big) {

function processDeaths() {
  let guard = 0;

// ---- loot: enemies drop gold & XP that must be collected
function dropLoot(e) {
  let xp = e.xp, gold = e.gold;
  if (S.converted) { xp += gold * GOLD_TO_XP; gold = 0; }
  const n = gold > 0 ? Math.min(3, Math.max(1, Math.round(gold / 2))) : 0;
  for (let i = 0; i < n; i++) addDrop('gold', gold / n, e.x, e.y);
  if (xp > 0) addDrop('xp', xp, e.x, e.y);
}
function addDrop(k, v, x, y) {
  if (S.drops.length > 280) { const o = S.drops.find(d => d.k === k && !d.mag); if (o) { o.v += v; return; } }
  const l = Math.hypot(x, y); if (l > R - 10) { x *= (R - 10) / l; y *= (R - 10) / l; }
  const a = Math.random() * TAU, sp = rnd(40, 110);
  S.drops.push({ k, v, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, mag: false, ph: Math.random() * TAU });
}
function updateDrops(dt) {
  const p = S.p, pr = tot.pickR * (S.collectT !== null ? 1.6 : 1);
  for (const d of S.drops) {
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.max(0, 1 - dt * 5); d.vy *= Math.max(0, 1 - dt * 5);
    const dx = p.x - d.x, dy = p.y - d.y, dist = Math.hypot(dx, dy) || 1;
    if (dist < pr) d.mag = true;
    if (d.mag) { const sp = 420 + (S.collectT !== null ? 300 : 0); d.x += dx / dist * sp * dt; d.y += dy / dist * sp * dt; }
    if (dist < PR + 7) {
      d.got = true;
      if (d.k === 'gold') { S.gold += d.v; AU.play('coin'); } else { gainXp(d.v); AU.play('xp'); }
    }
  }
  S.drops = S.drops.filter(d => !d.got);
}
function gainXp(n) {
  S.xp += n;
  while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.level++; S.pendingLv++; AU.play('level'); S.fx.push({ k: 'ring', x: S.p.x, y: S.p.y, r: 40, t: 0, life: .5, col: '#9b8cff' }); }

// thorns: every enemy attack is punished, even ones you're invulnerable to.

      const hp = sproutHp(bestGreenTier(), setv('green', 'treant', 'm'));
      S.treant = { x: p.x, y: p.y, hp, maxHp: hp, vx: 0, vy: 0, a: 0, hitCd: 0 };
      AU.play('summon'); S.fx.push({ k: 'ring', x: p.x, y: p.y, r: 40, t: 0, life: .4, col: COL.green });
    }
  }
}

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  S.time += dt;
  const p = S.p;
  S.avg = avgDmg();
  if (S.surge.t > 0) { S.surge.t -= dt; if (S.surge.t <= 0) S.surge.n = 0; }

  let mx = 0, my = 0;
  if (keys.has('w') || keys.has('arrowup')) my--;
  if (keys.has('s') || keys.has('arrowdown')) my++;
  if (keys.has('a') || keys.has('arrowleft')) mx--;
  if (keys.has('d') || keys.has('arrowright')) mx++;
  if (joy.on) { const jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy); if (jl > 6) { mx = jx / Math.max(jl, 50); my = jy / Math.max(jl, 50); } }
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  S.moving = ml > .1;
  const spd = tot.baseSpeed * surgeM();
  p.x += mx * spd * dt; p.y += my * spd * dt;
  const plen = Math.hypot(p.x, p.y); if (plen > R - PR) { p.x *= (R - PR) / plen; p.y *= (R - PR) / plen; }
  p.inv -= dt; p.shield = Math.max(0, p.shield - dt);
  S.staticCd -= dt; S.novaCd -= dt;
  p.hp = Math.min(tot.maxHp, p.hp + tot.regen * dt);

  if (S.bossPending) { S.bossT -= dt; if (S.bossT <= 0) { S.bossPending = false; spawnEnemy('boss'); S.shake = 10; } }
  if (S.toSpawn > 0) {
    S.spawnT -= dt;
    const cap = S.wave > 20 ? 150 : 110;
    if (S.spawnT <= 0 && S.enemies.length < cap) {
      S.spawnT = Math.max(S.wave > 20 ? .07 : .12, 1.05 - S.wave * .045);
      const a = Math.random() * TAU, type = pickW(enemyPool());
      const grp = Math.min(S.toSpawn, type === 'swarm' ? irnd(4, 6) : irnd(1, 2 + Math.floor(S.wave / 5)));
      for (let i = 0; i < grp; i++) { const aa = a + rnd(-.18, .18), rr = SPAWN_R + rnd(0, 30); spawnEnemy(type, Math.cos(aa) * rr, Math.sin(aa) * rr); }
      S.toSpawn -= grp;
    }
  }

  for (const l of S.later) { l.t -= dt; if (l.t <= 0 && !l.done) { l.done = true; l.f(); } }
  S.later = S.later.filter(l => !l.done);

  const as = (1 + tot.atkSpd / 100) * surgeM();
  for (const w of S.weapons) {
    w.anim = Math.max(0, w.anim - dt * 6);
    w.cd -= dt * as * (w.el === 'yellow' ? 1 + setv('yellow', 'current') / 100 : 1);
    if (w.cd <= 0) w.cd = weaponAttack(w) ? TYPES[w.type].cd * rnd(.95, 1.05) : .05;
    if (w.el === 'green') {
      w.sumT -= dt * (E('green', 'srate') + setv('green', 'swarm')) / 100;
      if (w.sumT <= 0) { w.sumT = SUM_CD; spawnSprouts(w.tier, p.x, p.y, 1 + setv('green', 'brood')); }
    }
  }
  abilities(dt);

  // projectiles: fireballs & ice shards
  for (const f of S.projs) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    if (f.kind === 'fireball') {
      if (Math.random() < .6) S.fx.push({ k: 'spark', x: f.x, y: f.y, vx: rnd(-25, 25), vy: rnd(-25, 25), t: 0, life: .3, col: '#ff9a3c' });
      for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - f.x, e.y - f.y) < e.r + 8) { f.life = 0; explode(f.x, f.y, f.rad, f.dmg, '#ff7a2a', { ignite: true }); break; }
    } else if (f.kind === 'boulder') {
      f.rot += dt * 8;
      if (Math.random() < .4) S.fx.push({ k: 'spark', x: f.x + rnd(-10, 10), y: f.y + rnd(-10, 10), vx: rnd(-20, 20), vy: rnd(-20, 20), t: 0, life: .4, col: '#8a7350' });
      for (const e of S.enemies) if (!e.dead && !f.hit.has(e) && Math.hypot(e.x - f.x, e.y - f.y) < e.r + 15) {
        f.hit.add(e); dealDamage(e, f.dmg, { col: '#c9a25a' }); stun(e, .3);
        if (!e.boss) { const l = Math.hypot(f.vx, f.vy); e.kx += -f.vy / l * 20 * (Math.random() < .5 ? 1 : -1); e.ky += f.vx / l * 20; }
      }
    } else if (f.kind === 'stone') {
      for (const e of S.enemies) if (!e.dead && !f.hit.has(e) && Math.hypot(e.x - f.x, e.y - f.y) < e.r + 5) { f.hit.add(e); dealDamage(e, f.dmg, { col: '#c9a25a' }); if (f.pierce-- <= 0) { f.life = 0; break; } }
    } else {
      for (const e of S.enemies) if (!e.dead && !f.hit.has(e) && Math.hypot(e.x - f.x, e.y - f.y) < e.r + 4) { f.hit.add(e); dealDamage(e, f.dmg, { col: '#bfeaff' }); applyChill(e, 1); }
    }
  }
  S.projs = S.projs.filter(f => f.life > 0);
  // flamethrower
  for (const fl of S.flames) {
    fl.t += dt; fl.tick -= dt;
    const tg = nearest(p.x, p.y, fl.rg + 40);
    if (tg) { const want = Math.atan2(tg.y - p.y, tg.x - p.x); fl.dir += clamp(angDiff(want, fl.dir), -3 * dt, 3 * dt); }
    for (let i = 0; i < 4; i++) { const a = fl.dir + rnd(-.5, .5), sp = rnd(180, 320); S.fx.push({ k: 'spark', x: p.x + Math.cos(a) * 14, y: p.y + Math.sin(a) * 14, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: fl.rg / 320, col: pick(['#ff7a2a', '#ffb347', '#ff5a3c']) }); }
    if (fl.tick <= 0) { fl.tick = .15; for (const e of S.enemies) if (!e.dead && inCone(e, p.x, p.y, fl.dir, .55, fl.rg)) { dealDamage(e, fl.dmg, { col: COL.red }); applyBurn(e, burnDpsFrom(fl.dmg * 3)); } }
  }
  S.flames = S.flames.filter(f => f.t < f.dur);
  // expanding rings
  for (const rg of S.rings) {
    rg.r += rg.spd * dt;
    for (const e of S.enemies) {
      if (e.dead || rg.hit.has(e)) continue;
      if (Math.abs(Math.hypot(e.x - rg.x, e.y - rg.y) - rg.r) < 12 + e.r) { rg.hit.add(e); dealDamage(e, rg.dmg, { col: COL.red }); applyBurn(e, burnDpsFrom(rg.dmg)); }
    }
  }
  S.rings = S.rings.filter(rg => rg.r < rg.max);
  // ground zones: fire trail & blizzard
  for (const z of S.zones) {
    z.life -= dt; z.tick -= dt;
    if (z.k === 'snow' && Math.random() < .7) S.fx.push({ k: 'spark', x: z.x + rnd(-z.r, z.r), y: z.y + rnd(-z.r, z.r), vx: rnd(-60, -20), vy: rnd(20, 60), t: 0, life: .5, col: '#e8f8ff' });
    if (z.tick <= 0) {
      z.tick = .3;
      for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - z.x, e.y - z.y) < z.r + e.r) {
        if (z.k === 'fire') { dealDamage(e, z.dps * .3, { col: COL.red, pierce: true }); applyBurn(e, burnDpsFrom(z.dps)); }
        else { dealDamage(e, z.dps * .3, { col: COL.blue }); applyChill(e, 1); }
      }
    }
  }
  S.zones = S.zones.filter(z => z.life > 0);
  // ice pillars
  for (const pi of S.pillars) {
    pi.life -= dt; pi.tick -= dt;
    if (pi.tick <= 0) { pi.tick = .4; for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - pi.x, e.y - pi.y) < pi.r + e.r) applyChill(e, 1); }
  }
  S.pillars = S.pillars.filter(pi => pi.life > 0);
  // ball lightning
  for (const o of S.orbs) {
    o.life -= dt; o.tick -= dt;
    const tg = nearest(o.x, o.y, 500);
    if (tg) { const a = Math.atan2(tg.y - o.y, tg.x - o.x); o.x += Math.cos(a) * 85 * dt; o.y += Math.sin(a) * 85 * dt; }
    if (o.tick <= 0) {
      o.tick = .3;
      const hit = new Set();
      for (let i = 0; i < 3; i++) { const e = nearest(o.x, o.y, 75, hit); if (!e) break; hit.add(e); lstrike(e, o.dmg, { from: o, noChain: true }); }
    }
  }
  S.orbs = S.orbs.filter(o => o.life > 0);
  // lightning rods
  for (const rd of S.rods) {
    rd.life -= dt; rd.tick -= dt;
    if (rd.tick <= 0) { rd.tick = rd.int; const e = nearest(rd.x, rd.y, 110); if (e) lstrike(e, rd.dmg, { from: { x: rd.x, y: rd.y - 22 } }); }
  }
  S.rods = S.rods.filter(rd => rd.life > 0);

  // enemies
  const slow = E('blue', 'slow') / 100, fb = setv('blue', 'frostbite');
  for (const e of S.enemies) {
    if (e.dead) continue;
    e.flash -= dt; e.atkCd -= dt; e.stun -= dt; e.frozen -= dt; e.wob += dt * 6;
    if (e.chillT > 0) { e.chillT -= dt; if (e.chillT <= 0) e.chill = 0; }
    if (e.burnT > 0) {
      e.burnT -= dt; e.burnTick -= dt;
      if (e.burnTick <= 0) { e.burnTick = .5; dealDamage(e, e.burnDps * .5, { col: '#ff8a4a', pierce: true }); }
      if (Math.random() < .25) S.fx.push({ k: 'spark', x: e.x + rnd(-e.r, e.r), y: e.y + rnd(-e.r, e.r), vx: rnd(-10, 10), vy: rnd(-50, -20), t: 0, life: .4, col: '#ff7a2a' });
      if (e.burnT <= 0) e.burnDps = 0;
    }
    if (fb && (e.chill > 0 || e.frozen > 0)) {
      e.fbT -= dt;
      if (e.fbT <= 0) { e.fbT = .5; dealDamage(e, S.avg * fb / 100 * .5 * (e.frozen > 0 ? 4 : e.chill), { col: '#9fe0ff', pierce: true }); }
    }
    if (e.dead) continue;
    const held = e.frozen > 0 || e.stun > 0;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    let vx = dx / d, vy = dy / d, sp = held ? 0 : e.spd * (e.chill > 0 ? 1 - slow : 1);
    if (e.type === 'charger') {
      e.dashCd -= dt;
      if (held) e.mode = 'walk';
      else if (e.mode === 'walk' && e.dashCd <= 0 && d < 240 && Math.hypot(e.x, e.y) < R + 10) { e.mode = 'wind'; e.modeT = .45; }
      else if (e.mode === 'wind') { sp = 0; e.modeT -= dt; e.dx = vx; e.dy = vy; if (e.modeT <= 0) { e.mode = 'dash'; e.modeT = .4; } }
      else if (e.mode === 'dash') { vx = e.dx; vy = e.dy; sp = 430 * (e.chill > 0 ? 1 - slow : 1); e.modeT -= dt; if (e.modeT <= 0) { e.mode = 'walk'; e.dashCd = rnd(2.2, 3.2); } }
    }
    if (e.boss && !held) { e.summonT -= dt; if (e.summonT <= 0) { e.summonT = 5; for (let i = 0; i < 3; i++) spawnEnemy('grunt', e.x + rnd(-30, 30), e.y + rnd(-30, 30)); } }
    e.x += vx * sp * dt + e.kx * Math.min(1, dt * 12); e.y += vy * sp * dt + e.ky * Math.min(1, dt * 12);
    e.kx *= Math.max(0, 1 - dt * 12); e.ky *= Math.max(0, 1 - dt * 12);
    if (!held && d < e.r + PR && e.atkCd <= 0) { e.atkCd = .9; thorns(e); hurt(e.dmg, e); if (S.phase !== 'fight') return; }
  }
  // separation + fire spread
  const es = S.enemies;
  S.spreadT -= dt;
  const doSpread = S.spreadT <= 0, spreadCh = E('red', 'spread');
  if (doSpread) S.spreadT = .3;
  for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
    const a = es[i], b = es[j], dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
    if (Math.abs(dx) > min + 6 || Math.abs(dy) > min + 6) continue;
    const d = Math.hypot(dx, dy);
    if (doSpread && d < min + 6 && (a.burnT > 0) !== (b.burnT > 0) && Math.random() * 100 < spreadCh) {
      const [src, dst] = a.burnT > 0 ? [a, b] : [b, a];
      applyBurn(dst, src.burnDps);
      S.fx.push({ k: 'spark', x: dst.x, y: dst.y, vx: 0, vy: -40, t: 0, life: .3, col: '#ffb347' });
    }
    if (d > 0 && d < min) { const k = (min - d) / d * .25, wa = a.boss ? .1 : 1, wb = b.boss ? .1 : 1; a.x -= dx * k * wa; a.y -= dy * k * wa; b.x += dx * k * wb; b.y += dy * k * wb; }
  }

  // sprouts
  const sSpd = 210 * (E('green', 'sspd') + setv('green', 'swarm', 'spd')) / 100;
  for (const s of S.sprouts) {
    s.life -= dt; s.hitCd -= dt;
    const tg = nearest(s.x, s.y, 600);
    let tx, ty;
    if (tg) { tx = tg.x; ty = tg.y; } else { s.a += dt * 2; tx = p.x + Math.cos(s.a) * 45; ty = p.y + Math.sin(s.a) * 45; }
    const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy) || 1, sp2 = sSpd * (s.big ? .7 : 1);
    s.vx += (dx / d * sp2 - s.vx) * Math.min(1, dt * 7); s.vy += (dy / d * sp2 - s.vy) * Math.min(1, dt * 7);
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.hitCd > 0) continue;
    for (const e of S.enemies) {
      if (e.dead || s.hp <= 0) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + (s.big ? 12 : 7)) { sproutContact(s, e, s.big); s.hitCd = .08; break; }
    }
  }
  const alive = [];
  for (const s of S.sprouts) { if (s.life > 0 && s.hp > 0.01) alive.push(s); else sproutDied(s); }
  S.sprouts = alive;
  // treant guardian
  const tr = S.treant;
  if (tr) {
    tr.hitCd -= dt; tr.hp = Math.min(tr.maxHp, tr.hp + tr.maxHp * .08 * dt);
    const tg = nearest(p.x, p.y, 140);
    let tx, ty;
    if (tg) { tx = tg.x; ty = tg.y; } else { tr.a += dt * 1.2; tx = p.x + Math.cos(tr.a) * 40; ty = p.y + Math.sin(tr.a) * 40; }
    const dx = tx - tr.x, dy = ty - tr.y, d = Math.hypot(dx, dy) || 1;
    tr.vx += (dx / d * 160 - tr.vx) * Math.min(1, dt * 5); tr.vy += (dy / d * 160 - tr.vy) * Math.min(1, dt * 5);
    tr.x += tr.vx * dt; tr.y += tr.vy * dt;
    if (tr.hitCd <= 0) for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - tr.x, e.y - tr.y) < e.r + 16) { sproutContact(tr, e, true); tr.hitCd = .15; break; }
    if (tr.hp <= 0.01) { sproutDied({ ...tr, big: true }); S.treant = null; S.treantT = setv('green', 'treant'); }
  }

  processDeaths();

  updateDrops(dt);
  S.coins = S.coins.filter(c => c.t < .4);
  updateFx(dt);

  if (S.toSpawn <= 0 && !S.bossPending && S.enemies.length === 0) {
    // short window to grab what's on the floor; the rest is lost
    if (S.collectT === null) S.collectT = S.drops.length ? 3 : 0;
    S.collectT -= dt;
    if (S.collectT <= 0 || S.drops.length === 0) endWave();
  }
}
function updateFx(dt) {
  for (const f of S.fx) { f.t += dt; if (f.k === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; } }
  if (S.fx.length > 900) S.fx.splice(0, S.fx.length - 900);
  S.fx = S.fx.filter(f => f.t < f.life);
  for (const t of S.texts) { t.t += dt; t.y -= 32 * dt; }
  S.texts = S.texts.filter(t => t.t < .75);
  S.shake = Math.max(0, S.shake - dt * 30);
  if (S.banner) { S.banner.t += dt; if (S.banner.t > 2.2) S.banner = null; }
}

// =====================================================================
//  SCREENS
// =====================================================================
const screen = document.getElementById('screen');
function showScreen(html, key) {
  // re-rendering the same screen (e.g. buying in the shop) keeps the scroll position
  const same = key && screen.dataset.key === key && screen.classList.contains('show');
  const old = same ? screen.querySelector('.panel') : null;
  const st = old ? old.scrollTop : 0, st2 = same ? screen.scrollTop : 0;
  screen.innerHTML = html; screen.dataset.key = key || ''; screen.classList.add('show');
  if (same) { const np = screen.querySelector('.panel'); if (np) np.scrollTop = st; screen.scrollTop = st2; }
}
function hideScreen() { screen.classList.remove('show'); screen.innerHTML = ''; screen.dataset.key = ''; }

function endWave() {
  const lost = { gold: 0, xp: 0 };
  for (const d of S.drops) lost[d.k] += d.v;
  S.lastLost = (lost.gold >= 1 || lost.xp >= 1) ? { gold: Math.floor(lost.gold), xp: Math.floor(lost.xp) } : null;
  S.drops = [];
  if (!S.converted) S.gold += 4 + S.wave * 2;
  S.sprouts = []; S.treant = null;
  saveBest();
  nextMenu();
}
function nextMenu() {
  if (S.pendingLv > 0) { S.phase = 'levelup'; S.perkOffer = rollLevelCards(); renderLevelUp(); }
  else if (S.converted) { S.phase = 'shop'; S.offers = []; renderShop(); }
  else { S.phase = 'shop'; S.rerolls = 0; S.rerollCost = rerollPrice(); S.offers = rollOffers(); renderShop(); }
}

function elemSetsHtml(sets, counts) {
  return `<div class="sets e4">${ORDER.map(c => {
    const n = (counts && counts[c]) || 0;
    return `<div class="rs ${counts && n ? 'own' : ''}" style="--c:${COL[c]}"><div class="h"><span>${ELEM[c]}</span><span>${counts ? n + ' / 6' : ''}</span></div>
      ${sets[c].map((e, i) => `<div class="e ${n >= ETHRESH[i] ? 'on' : ''}"><span class="pips">${'◆'.repeat(i + 1)}${'◇'.repeat(2 - i)}</span><b>(${ETHRESH[i]}) ${e.name}</b><br>${e.d(e, i)}</div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}
function typeSetsHtml(tsets, counts) {
  return `<div class="sets t5">${TYPE_KEYS.map(t => {
    const n = (counts && counts[t]) || 0;
    const own = counts && n > 0, c = own ? '#f2c14e' : COL.steel;
    return `<div class="rs ${own ? 'own' : ''}" style="--c:${c}"><div class="h"><span>${svg(t, c)}${TYPES[t].n}</span><span>${counts ? n + ' / 6' : ''}</span></div>
      ${tsets[t].map((k, i) => `<div class="e ${n >= TTHRESH[i] ? 'on' : ''}"><b>(${TTHRESH[i]})</b> ${statText(k, STAT[k].set)}</div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}

// ---- level up
function eligibleSecs(c) {
  return EPASS[c].filter(d => (!d.req || S.runSets[c].some(e => d.req.includes(e.id))) && E(c, d.k) < d.cap - 1e-9);
}
function rollLevelCards() {
  const prims = shuffle([...PRIM]).slice(0, 3);
  return prims.map(pr => {
    const rare = Math.random() < .18;
    let pv = pr.v * (rare ? 1.6 : 1);
    if (pr.k === 'flat') pv = Math.round((pr.v + Math.floor(S.wave / 5)) * (rare ? 1.5 : 1));
    else if (pr.k === 'regen') pv = Math.round(pv * 10) / 10;
    else pv = Math.round(pv);
    const opts = ORDER.filter(c => eligibleSecs(c).length).map(c => [c, (S.counts[c] || 0) * 1.5 + .5]);
    let sec = null;
    if (opts.length) { const c = pickW(opts); sec = { c, d: pick(eligibleSecs(c)) }; }
    return { pr, pv, rare, sec };
  });
}
function choosePerk(i) {
  const c = S.perkOffer && S.perkOffer[i];
  if (!c) return;
  AU.play('click');
  S.st[c.pr.k] += c.pv;
  if (c.pr.k === 'maxHp') S.p.hp += c.pv;
  if (c.sec) { const { c: el, d } = c.sec; S.ep[el][d.k] = (S.ep[el][d.k] || 0) + d.v; }
  S.pendingLv--;
  recalc();
  nextMenu();
}
const unit = (v, u) => `${fmt(v)}${u}`;
function secHtml(sec) {
  if (!sec) return `<div class="sec" style="--c:#555"><small>Secondary</small>Every element passive is maxed</div>`;
  const { c, d } = sec, cur = E(c, d.k), next = Math.min(d.cap, cur + d.v);
  return `<div class="sec" style="--c:${COL[c]}"><small>${ELEM[c]} secondary</small>+${unit(d.v, d.u)} ${d.t}
    <em>${unit(cur, d.u)} → ${unit(next, d.u)}${next >= d.cap ? ' · MAXED' : ` · max ${unit(d.cap, d.u)}`}</em></div>`;
}
function renderLevelUp() {
  saveRun();
  const conv = S.convertedInfo && S.wave === 20 ? `<div class="note endless"><b>Endless begins.</b> Your ${S.convertedInfo.gold} gold became ${S.convertedInfo.xp} XP. The shop is closed from here on: kills drop extra XP instead of gold.</div>` : '';
  showScreen(`<div class="panel" style="width:min(880px,100%)">${conv}
    <div class="head"><h2 style="color:var(--xp)">Level up</h2><span class="hint">${S.pendingLv > 1 ? S.pendingLv + ' level-ups to spend' : 'Choose one'}</span></div>

}

// ---- shop
const priceOf = t => Math.round([18, 42, 85, 160][t] * (1 + (S.wave - 1) * .06));
const upCost = t => Math.round(priceOf(t + 1) * 1.05);
// rerolls get exponentially pricier within one shop visit
const rerollPrice = () => Math.round((3 + S.wave) * Math.pow(1.85, S.rerolls));
const sellVal = t => Math.round(priceOf(t) * .4);
function rollTier() {
  const w = S.wave, r = Math.random();
  if (w >= 11 && r < .12 + Math.min(.3, Math.max(0, w - 20) * .03)) return 3;
  if (w >= 6 && r < .32) return 2;
  if (w >= 2 && r < .58) return 1;
  return 0;
}
function rollOffers() { return [0, 1, 2, 3].map(() => makeWeapon(pick(TYPE_KEYS), pick(ORDER), rollTier())); }
const wName = w => `${ADJ[w.el]} ${TYPES[w.type].n}`;
function elemLine(el, tier) {
  const g = (c, k) => S ? E(c, k) : EDEF[c][k].base;
  if (el === 'red') return `${fmt(g('red', 'ign'))}% chance to ignite on hit`;
  if (el === 'yellow') return `${fmt(g('yellow', 'arcCh'))}% chance to arc to ${g('yellow', 'jumps')} enemies`;
  if (el === 'blue') return `${fmt(g('blue', 'chillCh'))}% chance to chill (+${tier >= 2 ? 2 : 1}); 4 stacks freeze`;
  return `Summons a golem every ${SUM_CD}s (${SUMHP[tier]} HP) that inherits ${S ? fmt(E('green', 'bond')) : 60}% of your damage & crit`;
}
const afxHtml = w => w.afx.map(k => `<li class="af">${statText(k, afxVal(k, w.tier))}</li>`).join('');
const afxShort = w => w.afx.map(k => statText(k, afxVal(k, w.tier))).join(' · ');
function weaponCard(w, attrs, footer) {

}
function renderShop() {
  saveRun();
  const endless = S.converted;
  const g = Math.floor(S.gold), full = S.weapons.length >= 6;
  const lost = S.lastLost ? `<div class="note">Left on the floor last wave: ${S.lastLost.gold ? S.lastLost.gold + ' gold' : ''}${S.lastLost.gold && S.lastLost.xp ? ' and ' : ''}${S.lastLost.xp ? S.lastLost.xp + ' XP' : ''}. Pick loot up before the collect timer runs out!</div>` : '';
  const offers = S.offers.map((o, i) => {
    if (!o) return `<div class="card off" style="--c:#333;justify-content:center;align-items:center;min-height:120px"><span class="hint">Sold</span></div>`;
    const pr = priceOf(o.tier), can = g >= pr && !full;

  }).join('');
  const owned = [...S.weapons.map(w => {
    const uc = w.tier < 3 ? upCost(w.tier) : 0;
    return `<div class="wrow">${svg(w.type, COL[w.el])}<span class="n">${wName(w)} <span style="color:${COL[w.el]}">${ROMAN[w.tier]}</span><small>${afxShort(w)}</small></span>
      ${endless ? '' : w.tier < 3 ? `<button class="btn sm" data-act="up:${w.id}" ${g < uc ? 'disabled' : ''}>Upgrade <span class="gc">●</span> ${uc}</button>` : `<span class="hint" style="font-size:12px">MAX</span>`}
      ${endless ? '' : `<button class="btn sm" data-act="sell:${w.id}" ${S.weapons.length <= 1 ? 'disabled' : ''}>Sell +${sellVal(w.tier)}</button>`}</div>`;
  }), ...Array(6 - S.weapons.length).fill('<div class="wrow empty">Empty slot</div>')].join('');
  showScreen(`<div class="panel">
    <div class="head"><h2>${endless ? 'Endless' : 'Shop'} <span class="hint" style="font-size:14px;letter-spacing:.05em;text-transform:none">· wave ${S.wave} cleared</span></h2>
      <div style="display:flex;align-items:center;gap:18px">${endless ? '' : `<div class="goldbox">${g}</div>`}
      <button class="btn go" data-act="next">Wave ${S.wave + 1}${(S.wave + 1) % 10 === 0 ? ' · Boss' : S.wave + 1 === 21 ? ' · Endless' : ''} ▶</button></div></div>
    ${S.wave === 20 && !endless ? '<div class="note endless"><b>Next wave starts endless mode.</b> Any gold you haven\'t spent will be converted into XP (2 gold = 1 XP), and the shop closes for good.</div>' : ''}
    ${lost}
    <div class="shopgrid">
      <div>${endless ? `<div class="note endless" style="margin-top:16px"><b>The shop is closed.</b> Gold turned into XP when endless began, and every kill now drops extra XP instead. Your build grows through level-ups from here.${S.convertedInfo ? `<br>Converted: ${S.convertedInfo.gold} gold → ${S.convertedInfo.xp} XP.` : ''}</div>` : `
        <h3>For sale</h3><div class="offers">${offers}</div>
        <div style="margin-top:10px"><button class="btn" data-act="reroll" ${g < S.rerollCost ? 'disabled' : ''}>Reroll <span class="gc">●</span> ${S.rerollCost}</button></div>`}
      </div>
      <div>
        <h3>Weapons ${S.weapons.length}/6 <span>· upgrading also boosts a weapon's own stats</span></h3><div class="owned">${owned}</div>

    <div class="foot"><span class="hint">Enter starts the next wave. You're fully healed between waves. M / N toggle music / sound.</span></div>

}

// ---- start / end
function bestWave() { try { return +localStorage.getItem('lastCircleBest3') || 0; } catch (e) { return 0; } }
function saveBest() { try { if (S.wave > bestWave()) localStorage.setItem('lastCircleBest3', S.wave); } catch (e) {} }

  showScreen(`<div class="panel">

function gameOver() {
  S.phase = 'dead'; S.p.hp = 0; saveBest(); clearSave();
  AU.play('death');
  showScreen(`<div class="panel center" style="width:min(520px,100%)">
    <p class="big" style="color:var(--hp)">Fallen</p>

    <div class="chips" style="justify-content:center">${S.weapons.map(w => `<span class="chip" style="--c:${COL[w.el]}">${wName(w)} ${ROMAN[w.tier]}</span>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn go" data-act="restart">New run</button></div></div>`);

screen.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  AU.init();
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'start') { const st = pendingRun.starters[+arg]; newRun(st); pendingRun = null; return; }
  if (act === 'reroll-run') { AU.play('click'); pendingRun = rollRun(); renderStart(); return; }
  if (act === 'restart') { S = null; showHud(false); renderStart(); return; }
  if (act === 'continue') { const d = loadSave(); if (d) { pendingRun = null; resumeRun(d); } return; }
  if (act === 'quit') { paused = false; S = null; showHud(false); renderStart(); return; }
  if (act === 'resume') { togglePause(); return; }
  if (act === 'perk') { choosePerk(+arg); return; }
  if (act === 'next') { startWave(); return; }
  if (act === 'reroll') { AU.play('click'); S.gold -= S.rerollCost; S.rerolls++; S.rerollCost = rerollPrice(); S.offers = rollOffers(); renderShop(); return; }
  if (act === 'buy') { const o = S.offers[+arg]; if (!o) return; AU.play('buy'); S.gold -= priceOf(o.tier); addWeapon(o); S.offers[+arg] = null; renderShop(); return; }
  if (act === 'up') { const w = S.weapons.find(w => w.id === +arg); if (!w || w.tier >= 3) return; AU.play('buy'); S.gold -= upCost(w.tier); w.tier++; recalc(); renderShop(); return; }
  if (act === 'sell') { const w = S.weapons.find(w => w.id === +arg); if (!w || S.weapons.length <= 1) return; AU.play('coin'); S.gold += sellVal(w.tier); S.weapons = S.weapons.filter(x => x !== w); recalc(); renderShop(); return; }
});

const $ = id => document.getElementById(id);
function renderSlots() {
  $('slots').innerHTML = Array.from({ length: 6 }, (_, i) => {
    const w = S && S.weapons[i];
    return w ? `<div class="slot" style="border-color:${COL[w.el]}66">${svg(w.type, COL[w.el])}<b>${ROMAN[w.tier]}</b></div>` : `<div class="slot"></div>`;
  }).join('');
}
function updateHud() {
  if (!S) return;
  $('hpB').style.width = clamp(S.p.hp / tot.maxHp, 0, 1) * 100 + '%';
  $('hpT').textContent = `${Math.ceil(Math.max(0, S.p.hp))} / ${Math.round(tot.maxHp)}`;
  $('xpB').style.width = (S.xp / xpNeed()) * 100 + '%';
  $('xpT').textContent = `LV ${S.level}${S.pendingLv ? '  +' + S.pendingLv : ''}`;
  $('waveT').textContent = S.wave > 20 ? `Wave ${S.wave} · Endless` : `Wave ${S.wave}`;
  $('waveBox').classList.toggle('endless', S.wave > 20);
  $('leftT').textContent = `${S.toSpawn + S.enemies.length + (S.bossPending ? 1 : 0)} enemies left`;
  $('goldT').textContent = Math.floor(S.gold);
}
function musicMode() {
  if (!S) return 'calm';
  if (S.phase === 'dead') return null;
  if (S.phase !== 'fight') return 'calm';
  if (S.bossPending || S.enemies.some(e => e.boss)) return 'boss';
  return S.wave > 20 ? 'endless' : 'fight';
}

// =====================================================================
//  RENDER
// =====================================================================
function draw() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.fillStyle = '#08090d'; cx.fillRect(0, 0, VW, VH);
  const shake = S ? S.shake : 0;
  const ox = VW / 2 + rnd(-1, 1) * shake, oy = VH / 2 + 18 + rnd(-1, 1) * shake;
  cx.setTransform(DPR * SC, 0, 0, DPR * SC, ox * DPR, oy * DPR);
  const T = S ? S.time : performance.now() / 1000;
  const endless = S && S.wave > 20;
  const bossOn = S && S.enemies.some(e => e.boss);

  const g = cx.createRadialGradient(0, 0, 10, 0, 0, R);
  g.addColorStop(0, endless ? '#26121c' : bossOn ? '#24141f' : '#1a1724'); g.addColorStop(1, endless ? '#120a0f' : '#100f17');
  cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, R, 0, TAU); cx.fill();
  cx.strokeStyle = endless ? 'rgba(255,80,80,.05)' : 'rgba(255,255,255,.035)'; cx.lineWidth = 1;
  for (const rr of [R * .33, R * .66]) { cx.beginPath(); cx.arc(0, 0, rr, 0, TAU); cx.stroke(); }
  cx.save(); cx.rotate(T * (endless ? -.12 : .05));
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; cx.beginPath(); cx.moveTo(Math.cos(a) * R * .33, Math.sin(a) * R * .33); cx.lineTo(Math.cos(a) * R * .97, Math.sin(a) * R * .97); cx.stroke(); }
  cx.restore();
  const flick = endless && Math.random() < .04 ? .3 : 0;
  cx.lineWidth = 8; cx.strokeStyle = `rgba(255,90,60,${.12 + (endless ? .1 : 0)})`; cx.beginPath(); cx.arc(0, 0, R + 2, 0, TAU); cx.stroke();
  cx.lineWidth = 2.5; cx.strokeStyle = `rgba(255,120,80,${.55 + Math.sin(T * (endless ? 6 : 2)) * .15 - flick})`; cx.beginPath(); cx.arc(0, 0, R, 0, TAU); cx.stroke();

  if (!S) return;
  const p = S.p;

  // ground layer
  const aura = setv('red', 'inferno');
  if (aura) { cx.strokeStyle = 'rgba(255,110,50,.25)'; cx.lineWidth = 2; cx.setLineDash([4, 6]); cx.beginPath(); cx.arc(p.x, p.y, aura, 0, TAU); cx.stroke(); cx.setLineDash([]); }
  for (const z of S.zones) {
    const a = Math.min(1, z.life / Math.min(1, z.max));
    if (z.k === 'fire') { cx.fillStyle = `rgba(255,${90 + Math.random() * 60 | 0},40,${.22 * a})`; cx.beginPath(); cx.arc(z.x, z.y, z.r, 0, TAU); cx.fill(); }
    else { cx.fillStyle = `rgba(190,230,255,${.1 * a})`; cx.beginPath(); cx.arc(z.x, z.y, z.r, 0, TAU); cx.fill(); cx.strokeStyle = `rgba(220,245,255,${.4 * a})`; cx.setLineDash([2, 6]); cx.beginPath(); cx.arc(z.x, z.y, z.r, 0, TAU); cx.stroke(); cx.setLineDash([]); }
  }
  for (const pi of S.pillars) {
    const a = Math.min(1, pi.life);
    cx.fillStyle = `rgba(120,200,255,${.08 * a})`; cx.beginPath(); cx.arc(pi.x, pi.y, pi.r, 0, TAU); cx.fill();
    cx.strokeStyle = `rgba(190,234,255,${.35 * a})`; cx.lineWidth = 1.5; cx.setLineDash([3, 5]); cx.beginPath(); cx.arc(pi.x, pi.y, pi.r, 0, TAU); cx.stroke(); cx.setLineDash([]);
  }

  for (const d of S.drops) {
    const blink = S.collectT !== null && S.collectT < 1.2 && Math.floor(S.collectT * 10) % 2 === 0;
    if (blink) continue;
    const b = 1 + Math.sin(T * 6 + d.ph) * .15;
    if (d.k === 'gold') {
      cx.fillStyle = 'rgba(242,193,78,.22)'; cx.beginPath(); cx.arc(d.x, d.y, 10 * b, 0, TAU); cx.fill();
      cx.fillStyle = '#f2c14e'; cx.beginPath(); cx.arc(d.x, d.y, 5, 0, TAU); cx.fill();
      cx.fillStyle = '#fff2c4'; cx.beginPath(); cx.arc(d.x - 1.4, d.y - 1.4, 1.6, 0, TAU); cx.fill();
    } else {
      const s2 = 5.5 * b * (d.v >= 4 ? 1.35 : 1);
      cx.fillStyle = 'rgba(155,140,255,.2)'; cx.beginPath(); cx.arc(d.x, d.y, s2 * 2, 0, TAU); cx.fill();
      cx.fillStyle = '#b4a8ff'; cx.beginPath(); cx.moveTo(d.x, d.y - s2); cx.lineTo(d.x + s2, d.y); cx.lineTo(d.x, d.y + s2); cx.lineTo(d.x - s2, d.y); cx.closePath(); cx.fill();
    }
  }

  for (const e of S.enemies) drawEnemy(e, T);

  for (const pi of S.pillars) {
    cx.save(); cx.translate(pi.x, pi.y); cx.globalAlpha = Math.min(1, pi.life);
    cx.fillStyle = '#cdeeff'; cx.strokeStyle = '#ffffff'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(0, -22); cx.lineTo(8, -6); cx.lineTo(6, 10); cx.lineTo(-6, 10); cx.lineTo(-8, -6); cx.closePath(); cx.fill(); cx.stroke();
    cx.restore(); cx.globalAlpha = 1;
  }
  for (const rd of S.rods) {
    cx.globalAlpha = Math.min(1, rd.life);
    cx.strokeStyle = '#ffe680'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(rd.x, rd.y + 6); cx.lineTo(rd.x, rd.y - 22); cx.stroke();
    cx.fillStyle = '#fff6c0'; cx.beginPath(); cx.arc(rd.x, rd.y - 24, 4 + Math.sin(T * 20) * 1.2, 0, TAU); cx.fill();
    cx.strokeStyle = 'rgba(255,220,90,.15)'; cx.lineWidth = 1; cx.beginPath(); cx.arc(rd.x, rd.y, 110, 0, TAU); cx.stroke();
    cx.globalAlpha = 1;
  }

  const drawSprout = (s, k, fade, col) => {
    cx.globalAlpha = fade;
    cx.fillStyle = 'rgba(94,224,138,.15)'; cx.beginPath(); cx.arc(s.x, s.y, 10 * k, 0, TAU); cx.fill();
    cx.fillStyle = col; cx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + (s.seed || 0), r2 = 6.5 * k * (.82 + .18 * Math.sin(i * 2.7 + (s.seed || 0) * 5)); cx.lineTo(s.x + Math.cos(a) * r2, s.y + Math.sin(a) * r2); }
    cx.closePath(); cx.fill();
    cx.fillStyle = '#2d4a2a'; cx.fillRect(s.x - 2.6 * k, s.y - 1.4 * k, 1.7 * k, 1.7 * k); cx.fillRect(s.x + .9 * k, s.y - 1.4 * k, 1.7 * k, 1.7 * k);
    cx.strokeStyle = COL.green; cx.lineWidth = 1.6; cx.beginPath(); cx.arc(s.x, s.y, 8.5 * k, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(s.hp / s.maxHp, 0, 1)); cx.stroke();
    cx.globalAlpha = 1;
  };
  for (const s of S.sprouts) drawSprout(s, s.big ? 1.9 : 1, s.life < 1 ? s.life : 1, s.big ? '#9cc98a' : '#b9d8a2');
  if (S.treant) {
    const t = S.treant;
    drawSprout(t, 2.4, 1, '#5fbf78');
    cx.strokeStyle = '#2e6b3e'; cx.lineWidth = 3;
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU + T; cx.beginPath(); cx.moveTo(t.x + Math.cos(a) * 14, t.y + Math.sin(a) * 14); cx.lineTo(t.x + Math.cos(a) * 22, t.y + Math.sin(a) * 22); cx.stroke(); }
  }

  for (const f of S.projs) {
    if (f.kind === 'boulder') {
      cx.save(); cx.translate(f.x, f.y); cx.rotate(f.rot);
      cx.fillStyle = '#7a6446'; cx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, r2 = 14 * (.85 + .15 * Math.sin(i * 3.1)); cx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); } cx.closePath(); cx.fill();
      cx.fillStyle = '#5a4832'; cx.beginPath(); cx.arc(-4, -3, 3, 0, TAU); cx.arc(5, 4, 2.4, 0, TAU); cx.fill();
      cx.restore();
    } else if (f.kind === 'stone') { cx.fillStyle = '#a88a5c'; cx.beginPath(); cx.arc(f.x, f.y, 4, 0, TAU); cx.fill(); }
  }
  cx.globalCompositeOperation = 'lighter';

    } else if (f.k === 'swing') {

    } else if (f.k === 'warn') {

      cx.fillStyle = hexA(f.col, .15 * k); cx.beginPath(); cx.arc(f.x, f.y, f.r * k, 0, TAU); cx.fill();
    } else if (f.k === 'spike') {

      cx.fillStyle = `rgba(210,240,255,${a})`; cx.beginPath(); cx.moveTo(f.x - 6, f.y + 4); cx.lineTo(f.x, f.y - h); cx.lineTo(f.x + 6, f.y + 4); cx.closePath(); cx.fill();
    } else if (f.k === 'ring' || f.k === 'pop') {

    } else if (f.k === 'spark') {
      cx.fillStyle = hexA(f.col, a); cx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3);
    } else if (f.k === 'crack') {
      cx.strokeStyle = `rgba(201,162,90,${a * .8})`; cx.lineWidth = 2.5; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(f.x1, f.y1); cx.lineTo((f.x1 + f.x2) / 2 + 3, (f.y1 + f.y2) / 2 - 3); cx.lineTo(f.x2, f.y2); cx.stroke();
    } else if (f.k === 'spikes') {
      cx.fillStyle = `rgba(230,200,130,${a})`;
      for (let i = -2; i <= 2; i++) { const an = f.dir + i * .35, r1 = PR + 2, r2 = PR + 10 + 6 * (1 - Math.abs(i) / 3); cx.beginPath(); cx.moveTo(f.x + Math.cos(an - .12) * r1, f.y + Math.sin(an - .12) * r1); cx.lineTo(f.x + Math.cos(an) * r2, f.y + Math.sin(an) * r2); cx.lineTo(f.x + Math.cos(an + .12) * r1, f.y + Math.sin(an + .12) * r1); cx.closePath(); cx.fill(); }
    }
  }
  cx.globalCompositeOperation = 'source-over';

  // storm cloud
  if (setv('yellow', 'storm')) {
    const sx = p.x + Math.cos(T) * 20, sy = p.y - 40;
    cx.fillStyle = 'rgba(70,72,95,.85)';
    for (const [ox2, oy2, r2] of [[-10, 0, 9], [0, -4, 11], [11, 0, 8]]) { cx.beginPath(); cx.arc(sx + ox2, sy + oy2, r2, 0, TAU); cx.fill(); }
    if (Math.random() < .05) { cx.fillStyle = 'rgba(255,230,120,.8)'; cx.beginPath(); cx.arc(sx, sy, 6, 0, TAU); cx.fill(); }
  }

  const n = S.weapons.length;
  S.weapons.forEach((w, i) => {
    const idle = T * .9 + i * TAU / n;
    const a = w.anim > 0 ? w.dir : idle, reach = 20 + w.anim * 14;
    cx.save(); cx.translate(p.x + Math.cos(a) * reach, p.y + Math.sin(a) * reach); cx.rotate(a);
    drawWeapon(w.type, COL[w.el], 1 + w.tier * .12);
    cx.restore();
  });
  if (p.shield > 0) { cx.strokeStyle = `rgba(255,220,90,${.5 + Math.sin(T * 20) * .3})`; cx.lineWidth = 2.5; cx.beginPath(); cx.arc(p.x, p.y, PR + 9, 0, TAU); cx.stroke(); }
  if (S.surge.n > 0) { cx.strokeStyle = `rgba(255,220,90,${.15 + S.surge.n * .04})`; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(p.x, p.y, PR + 4 + Math.sin(T * 25) * 2, 0, TAU); cx.stroke(); }
  const hurtFlash = p.inv > 0 && p.shield <= 0 && S.phase === 'fight' && Math.floor(p.inv * 20) % 2 === 0;
  cx.fillStyle = 'rgba(255,255,255,.08)'; cx.beginPath(); cx.arc(p.x, p.y, PR + 6, 0, TAU); cx.fill();
  cx.fillStyle = S.phase === 'dead' ? '#e5484d' : hurtFlash ? '#ff8a8a' : '#f4f1ea';
  cx.beginPath(); cx.arc(p.x, p.y, PR, 0, TAU); cx.fill();
  cx.fillStyle = '#0d0e14'; cx.beginPath(); cx.arc(p.x, p.y, PR * .45, 0, TAU); cx.fill();

  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const t of S.texts) {
    const a = 1 - t.t / .75;
    cx.font = `700 ${t.crit ? 17 : 12}px "Chakra Petch", sans-serif`;
    cx.fillStyle = `rgba(0,0,0,${a * .6})`; cx.fillText(t.s, t.x + 1, t.y + 1);
    cx.fillStyle = hexA(t.col, a); cx.fillText(t.s, t.x, t.y);
  }

  // ---- screen space
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // tension vignette: heartbeat past wave 20, low pulse for bosses, red flash when low HP
  const lowHp = S.phase === 'fight' && p.hp / tot.maxHp < .3;
  if (endless || bossOn || lowHp) {
    let a = 0;
    if (endless) { const bpm = Math.min(150, 98 + (S.wave - 21) * 4), ph = (T * bpm / 60) % 1; a = .22 + Math.max(0, 1 - ph * 5) * .25 + Math.max(0, 1 - Math.abs(ph - .15) * 6) * .15; }
    else if (bossOn) a = .18 + Math.sin(T * 4.7) * .06;
    if (lowHp) a = Math.max(a, .25 + Math.sin(T * 9) * .12);
    const vg = cx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .3, VW / 2, VH / 2, Math.max(VW, VH) * .7);
    vg.addColorStop(0, 'rgba(120,0,10,0)'); vg.addColorStop(1, `rgba(120,0,10,${clamp(a, 0, .7)})`);

    const w = Math.min(420, VW - 40), x = (VW - w) / 2, y = VH - 78;
    cx.fillStyle = '#1a1c24'; cx.fillRect(x, y, w, 10);
    cx.fillStyle = '#c8436a'; cx.fillRect(x, y, w * Math.max(0, boss.hp / boss.maxHp), 10);
    cx.font = '600 12px "Chakra Petch"'; cx.fillStyle = '#e4e1d8'; cx.textAlign = 'center'; cx.fillText('THE HOLLOW KING', VW / 2, y - 9);
  }
  if (S.collectT !== null && S.collectT > 0 && S.phase === 'fight') {
    cx.font = `700 ${Math.min(30, VW / 18)}px "Chakra Petch"`; cx.textAlign = 'center';
    cx.fillStyle = '#f2c14e'; cx.fillText(`COLLECT · ${S.collectT.toFixed(1)}s`, VW / 2, VH * .22);
  }
  if (S.banner) {
    const a = S.banner.t < .3 ? S.banner.t / .3 : S.banner.t > 1.7 ? (2.2 - S.banner.t) / .5 : 1;
    cx.font = `700 ${Math.min(44, VW / 14)}px "Chakra Petch"`; cx.textAlign = 'center';
    cx.fillStyle = S.wave > 20 ? `rgba(255,110,90,${a})` : `rgba(244,241,234,${a})`; cx.fillText(S.banner.text.toUpperCase(), VW / 2, VH * .3);

    cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(joy.ox, joy.oy, 50, 0, TAU); cx.stroke();
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy), m = Math.min(1, 50 / (jl || 1));
    cx.fillStyle = 'rgba(255,255,255,.3)'; cx.beginPath(); cx.arc(joy.ox + jx * m, joy.oy + jy * m, 20, 0, TAU); cx.fill();

}
function drawWeapon(type, col, s) {
  cx.strokeStyle = col; cx.fillStyle = col; cx.lineCap = 'round'; cx.lineWidth = 2.2;
  cx.shadowColor = col; cx.shadowBlur = 6;
  cx.beginPath();
  if (type === 'dagger') { cx.moveTo(-3, 0); cx.lineTo(9 * s, 0); cx.moveTo(0, -3.5); cx.lineTo(0, 3.5); }
  else if (type === 'sword') { cx.moveTo(-4, 0); cx.lineTo(15 * s, 0); cx.moveTo(1, -4.5); cx.lineTo(1, 4.5); }
  else if (type === 'axe') { cx.moveTo(-5, 0); cx.lineTo(12 * s, 0); cx.stroke(); cx.beginPath(); cx.moveTo(8 * s, 0); cx.arc(9 * s, 0, 6 * s, -Math.PI * .9, -Math.PI * .1); cx.closePath(); cx.fill(); }
  else if (type === 'spear') { cx.moveTo(-6, 0); cx.lineTo(20 * s, 0); cx.stroke(); cx.beginPath(); cx.moveTo(25 * s, 0); cx.lineTo(19 * s, -3.5); cx.lineTo(19 * s, 3.5); cx.closePath(); cx.fill(); }
  else if (type === 'shield') { cx.arc(-2, 0, 8 * s, -1.1, 1.1); cx.lineWidth = 3.5; }

  cx.shadowBlur = 0;
}
function drawEnemy(e, T) {
  const r = e.r, wob = 1 + Math.sin(e.wob) * .04;

  if (e.mode === 'wind') cx.translate(rnd(-1.5, 1.5), rnd(-1.5, 1.5));

  if (e.flash > 0) fill = '#ffffff';
  cx.fillStyle = fill;
  cx.beginPath();
  const ang = Math.atan2(S.p.y - e.y, S.p.x - e.x);
  if (e.shape === 'circle') cx.arc(0, 0, r * wob, 0, TAU);
  else if (e.shape === 'tri') { cx.moveTo(Math.cos(ang) * r * 1.3, Math.sin(ang) * r * 1.3); cx.lineTo(Math.cos(ang + 2.4) * r, Math.sin(ang + 2.4) * r); cx.lineTo(Math.cos(ang - 2.4) * r, Math.sin(ang - 2.4) * r); cx.closePath(); }
  else if (e.shape === 'square') cx.rect(-r * wob, -r * wob, r * 2 * wob, r * 2 * wob);
  else if (e.shape === 'diamond') { const a2 = e.mode === 'dash' || e.mode === 'wind' ? Math.atan2(e.dy, e.dx) : ang; cx.moveTo(Math.cos(a2) * r * 1.4, Math.sin(a2) * r * 1.4); cx.lineTo(Math.cos(a2 + 1.57) * r * .8, Math.sin(a2 + 1.57) * r * .8); cx.lineTo(-Math.cos(a2) * r, -Math.sin(a2) * r); cx.lineTo(Math.cos(a2 - 1.57) * r * .8, Math.sin(a2 - 1.57) * r * .8); cx.closePath(); }
  else for (let i = 0; i < 10; i++) { const a = i / 10 * TAU + T * .4, rr = i % 2 ? r * .78 : r * 1.05; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.fill();
  if (e.armor > 0 && e.flash <= 0) { cx.strokeStyle = 'rgba(200,200,220,.4)'; cx.lineWidth = Math.min(5, 1 + e.armor * .12); cx.stroke(); }
  if (e.flash <= 0) { cx.fillStyle = e.frozen > 0 ? '#1a3a4a' : e.mode === 'wind' ? '#ff4d4d' : '#ffe0f0'; cx.beginPath(); cx.arc(Math.cos(ang) * r * .4, Math.sin(ang) * r * .4, Math.max(1.8, r * .16), 0, TAU); cx.fill(); }
  if (e.seed) { cx.fillStyle = '#5ee08a'; cx.beginPath(); cx.arc(-r * .5, -r * .6, 2.2, 0, TAU); cx.fill(); }
  if (e.burnT > 0) { cx.strokeStyle = 'rgba(255,120,40,.85)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(0, 0, r + 3, 0, TAU); cx.stroke(); }
  if (e.chill > 0 && e.frozen <= 0) { cx.strokeStyle = 'rgba(79,195,255,.85)'; cx.lineWidth = 1.5; cx.setLineDash([3, 3]); cx.beginPath(); cx.arc(0, 0, r + 6, 0, TAU * Math.min(1, e.chill / 4)); cx.stroke(); cx.setLineDash([]); }
  if (e.frozen > 0) { cx.strokeStyle = '#e0f6ff'; cx.lineWidth = 2; cx.strokeRect(-r - 3, -r - 3, r * 2 + 6, r * 2 + 6); }
  if (e.stun > 0) { cx.fillStyle = '#ffd23f'; for (let i = 0; i < 3; i++) { const a = T * 6 + i * TAU / 3; cx.fillRect(Math.cos(a) * r * .9 - 1.5, -r - 6 + Math.sin(a) * 3, 3, 3); } }
  if (e.hp < e.maxHp && !e.boss) {
    cx.fillStyle = 'rgba(0,0,0,.6)'; cx.fillRect(-r, r + 5, r * 2, 3);
    cx.fillStyle = '#e5484d'; cx.fillRect(-r, r + 5, r * 2 * Math.max(0, e.hp / e.maxHp), 3);

}
const hexCache = {};
function hexA(hex, a) {

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S && S.phase === 'fight' && !paused) update(dt);

  draw();
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderStart();

})();
