<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Last Circle</title>
<style>html,body{margin:0;height:100%;background:#08090d}</style>
</head>
<body>
<script>
// Loader: runs the newest copy of the game it has.
// The app ships with game.html; downloaded updates are kept in localStorage ('lcOta') and used when they're newer.
(async () => {
  const ver = h => { const m = h && h.match(/const GAME_VERSION = (\d+);/); return m ? +m[1] : 0; };
  let html = null;
  try { html = await (await fetch('game.html', { cache: 'no-store' })).text(); } catch (e) {}
  try {
    const ota = JSON.parse(localStorage.getItem('lcOta') || 'null');
    if (ota && ota.html && ota.v > ver(html)) html = ota.html;
    else if (ota) localStorage.removeItem('lcOta');   // the installed app caught up, drop the old download
  } catch (e) {}
  if (!html) { location.replace('game.html'); return; }
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
