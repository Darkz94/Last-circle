<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Circle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Last Circle</title>
<style>
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/chakra-petch-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#07080b; --panel:#12141b; --panel2:#191c26; --line:#272b38; --text:#e6e3da; --dim:#8b8898;
  --red:#ff5a3c; --yellow:#ffd23f; --blue:#4fc3ff; --green:#5ee08a; --gold:#f2c14e; --hp:#e5484d; --xp:#9b8cff; --steel:#c9cbd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- HUD */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:2}
.bars{width:min(240px,36vw)}
.bar{height:14px;background:#15171e;border-radius:4px;overflow:hidden;position:relative;margin-bottom:5px;border:1px solid #2a2d3a}
.bar i{position:absolute;inset:0 auto 0 0;display:block;background:linear-gradient(180deg,#f2575c,#c93238);transition:width .12s}
.bar.xp{height:9px}.bar.xp i{background:linear-gradient(180deg,#b3a6ff,#7f6ef0)}
.bar span{position:absolute;inset:0;font-size:10px;line-height:13px;text-align:center;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.bar.xp span{font-size:8px;line-height:8px}
.wave{text-align:center;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;text-shadow:0 2px 6px #000}
.wave small{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em;font-size:11px;margin-top:1px}
.wave.endless span{color:var(--red);animation:throb 1.2s infinite}
@keyframes throb{50%{opacity:.55}}
.hright{display:flex;align-items:center;gap:10px;min-width:min(240px,36vw);justify-content:flex-end}
.goldbox{font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap;text-shadow:0 2px 6px #000}
.goldbox::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c4,var(--gold) 55%,#b8862a);margin-right:6px;box-shadow:0 0 8px rgba(242,193,78,.6)}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:8px;background:rgba(24,27,36,.85);border:1px solid #343a4c;font-size:13px;cursor:pointer}
.slots{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:none;z-index:2}
.slot{width:40px;height:40px;border:1px solid var(--line);border-radius:7px;background:rgba(18,20,27,.82);display:flex;align-items:center;justify-content:center;position:relative}
.slot svg{width:22px;height:22px}
.slot b{position:absolute;bottom:0;right:3px;font-size:9px;color:var(--dim)}
.slot.evo{box-shadow:0 0 10px var(--c),inset 0 0 8px var(--c)}

/* ---------- sheets (menus). Phone first: full screen, tabs, no page scrolling */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,9,.84);backdrop-filter:blur(3px);z-index:10}
.screen.show{display:flex}
.sheet{width:min(780px,100%);height:min(100%,860px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.small{height:auto;max-height:100%}
.shead{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:20px;letter-spacing:.12em;text-transform:uppercase;line-height:1.1}
.shead h1{margin:0;font-size:30px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.shead h1 em{font-style:normal;color:var(--red)}
.hr{display:flex;align-items:center;gap:10px}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#0f1117}
.tab{flex:1;padding:13px 2px;text-align:center;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--text);border-bottom-color:var(--red)}
.sbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#0f1117}
h3{margin:14px 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
h3:first-child{margin-top:0}
h3 span{text-transform:none;letter-spacing:.02em}
.hint{color:var(--dim);font-size:12px}
.gc{color:var(--gold)}

.btn{font-weight:600;background:#1f2330;border:1px solid #343a4c;border-radius:8px;padding:10px 14px;cursor:pointer;letter-spacing:.03em;min-height:42px;font-size:14px}
.btn:disabled{opacity:.38;cursor:default}
.btn.go{background:linear-gradient(180deg,#ff6a4c,#e8482c);border-color:#ff7a5c;color:#160806;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.btn.ok{background:linear-gradient(180deg,#6fe89a,#3fbf6a);border-color:#7ff0a8;color:#06160b;font-weight:700}
.btn.wide{flex:1}
.btn.sm{padding:6px 10px;font-size:12px;min-height:34px}
.btn.on{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--c,#555);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0}
.card.off{opacity:.42;cursor:default}
.card.flat{cursor:default}
.card .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .t .ic{display:flex;align-items:center;gap:6px;min-width:0}
.card .t svg{width:18px;height:18px;flex-shrink:0}
.card .el{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.card .ln{font-size:12px;color:#c4c1b8;line-height:1.35}
.card .ln.af{color:var(--steel);font-weight:600}
.card .price{margin-top:auto;padding-top:6px;font-weight:700;color:var(--gold);font-size:14px}
.card.kept{box-shadow:0 0 0 2px var(--gold) inset}
.big{font-size:17px;font-weight:700;line-height:1.25;margin:3px 0 1px}
.sec{font-size:13px;border-left:3px solid #7a8199;padding:6px 9px;background:#10121a;border-radius:0 6px 6px 0;margin:6px 0}
.sec small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#9aa0b4;margin-bottom:1px}
.rare{font-size:9px;letter-spacing:.14em;color:#111;background:var(--gold);padding:1px 5px;border-radius:3px;font-weight:700}

.wrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c,#444);border-radius:8px;padding:8px 9px;margin-bottom:7px}
.wrow svg{width:22px;height:22px;flex-shrink:0}
.wrow .n{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.wrow .n small{display:block;font-size:11px;color:var(--steel);opacity:.85;font-weight:500}
.wrow.empty{color:#4c4f5c;font-size:13px;justify-content:center;border-left-color:#333;border-style:dashed}
.wrow .acts{display:flex;flex-direction:column;gap:5px}

.rs{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.38;margin-bottom:8px}
.rs .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--c);font-size:13px;margin-bottom:3px;letter-spacing:.05em}
.rs .h span:first-child{display:flex;align-items:center;gap:6px}
.rs .h svg{width:16px;height:16px}
.rs .e{padding:5px 0;border-top:1px solid #20232d;color:#63667a}
.rs .e:first-of-type{border-top:0}
.rs .e b{font-weight:600}
.rs .e.on{color:var(--text)}
.rs .e.on b{color:var(--c)}
.rs.own{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 15%,transparent),color-mix(in srgb,var(--c) 3%,transparent)),var(--panel2);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.pips{float:right;letter-spacing:1px;color:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols .rs{margin:0}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 7px;border-radius:5px;background:#1f2330;border:1px solid var(--line);border-left:3px solid var(--c,#666);white-space:nowrap}
.chip b{color:var(--c)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;color:#c4c1b8}
.stats span{display:flex;justify-content:space-between;border-bottom:1px solid #1d2029;padding:3px 0}
.stats b{color:var(--text)}
.note{background:#1b1712;border:1px solid #4a3c1c;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:10px}
.note.red{background:#1d1013;border-color:#5a2028;border-left-color:var(--red)}
.note.green{background:#0f1a13;border-color:#1f5a34;border-left-color:var(--green)}
.note.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cx{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.35;margin-bottom:5px;color:#c4c1b8}
.cx b{color:var(--text)}
.cx.un{opacity:.4;border-left-color:#444}
.center{text-align:center}
.huge{font-size:34px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;font-weight:700}

@media (max-width:800px){
  .sheet{border-radius:0;border:0;height:100%;width:100%}
  .sheet.small{height:auto;border-radius:14px;border:1px solid var(--line);width:calc(100% - 20px)}
  .grid3{grid-template-columns:1fr}
  .wave{font-size:12px}
  .goldbox{font-size:17px}
}
@media (max-width:420px){ .cols{grid-template-columns:1fr} .card .t{font-size:13px} }
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:6px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.tile span{font-size:11px;color:#9a978e}
.tile b{font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:11px;color:#9a978e}
.sbar{margin-bottom:8px}
.sbar .bl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;margin-bottom:3px}
.sbar .bl b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbar .bt{height:7px;background:#1d2029;border-radius:4px;overflow:hidden}
.sbar .bt i{display:block;height:100%;border-radius:4px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud hidden" id="hud">
  <div class="bars">
    <div class="bar"><i id="hpB"></i><span id="hpT"></span></div>
    <div class="bar xp"><i id="xpB"></i><span id="xpT"></span></div>
  </div>
  <div class="wave" id="waveBox"><span id="waveT"></span><small id="leftT"></small></div>
  <div class="hright"><div class="goldbox" id="goldT">0</div><button id="pauseBtn" class="ib" aria-label="Pause">❚❚</button></div>
</div>
<div class="slots hidden" id="slots"></div>
<div class="screen" id="screen"></div>
<script>
(() => {
"use strict";
// ===== core: constants and small helpers
const GAME_VERSION = 17;
const TAU = Math.PI * 2, R = 300, SPAWN_R = R + 85, PR = 13, STEP = 1 / 60;
const ORDER = ['red', 'yellow', 'blue', 'green'];
const COL = { red: '#ff5a3c', yellow: '#ffd23f', blue: '#4fc3ff', green: '#5ee08a', steel: '#c9cbd6', gold: '#f2c14e', xp: '#9b8cff' };
const ELEM = { red: 'Fire', yellow: 'Lightning', blue: 'Frost', green: 'Earth' };
const ADJ = { red: 'Ember', yellow: 'Storm', blue: 'Frost', green: 'Stone' };
const EVO = { red: 'Sunforged', yellow: 'Skybreaker', blue: 'Winterheart', green: 'Worldroot' };
const ROMAN = ['I', 'II', 'III', 'IV'];
const TM = [1, 1.65, 2.6, 4.8];        // weapon damage by tier
const ETHRESH = [2, 4, 6];             // element set thresholds
const TTHRESH = [1, 3, 6];             // weapon-type set thresholds
const FIRE = '#ff7a2a', ICE = '#bfeaff', ROCK = '#c9a25a';

const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickW = list => { let t = list.reduce((s, x) => s + x[1], 0), r = Math.random() * t; for (const x of list) if ((r -= x[1]) <= 0) return x[0]; return list[0][0]; };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const fmt = v => (Math.round(v * 100) / 100).toString();
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const $ = id => document.getElementById(id);

const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// colour helpers (cached)
const _rgb = {};
function rgbOf(hex) { let c = _rgb[hex]; if (!c) { const h = hex.replace('#', ''); c = _rgb[hex] = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; } return c; }
function rgba(hex, a) { const c = rgbOf(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a < 0 ? 0 : a > 1 ? 1 : a})`; }
const _shade = {};
function shade(hex, f) {   // f < 1 darkens, f > 1 lightens
  const k = hex + f; let s = _shade[k];
  if (!s) { const c = rgbOf(hex); const m = v => Math.round(f <= 1 ? v * f : v + (255 - v) * (f - 1)); s = _shade[k] = `rgb(${m(c[0])},${m(c[1])},${m(c[2])})`; }
  return s;
}

// spatial grid: cheap "who is near here" lookups for enemies
const CELL = 56, GOFF = SPAWN_R + 200;
const grid = {
  cells: new Map(),
  build(list) {
    this.cells.clear();
    for (const e of list) {
      if (e.dead) continue;
      const k = ((e.x + GOFF) / CELL | 0) * 1000 + ((e.y + GOFF) / CELL | 0);
      const c = this.cells.get(k); if (c) c.push(e); else this.cells.set(k, [e]);
    }
  },
  near(x, y, r, fn) {
    const x0 = (x - r + GOFF) / CELL | 0, x1 = (x + r + GOFF) / CELL | 0, y0 = (y - r + GOFF) / CELL | 0, y1 = (y + r + GOFF) / CELL | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const c = this.cells.get(gx * 1000 + gy);
      if (c) for (let i = 0; i < c.length; i++) fn(c[i]);
    }
  },
};

// ===== audio: all sound is synthesised with WebAudio, no files
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const AU = {
  ctx: null, on: { music: true, sfx: true }, last: {}, mode: null, step: 0, nextT: 0, voices: 0, wave: 1,
  load() { try { const s = JSON.parse(localStorage.getItem('lcAudio') || 'null'); if (s) this.on = s; } catch (e) {} },
  save() { try { localStorage.setItem('lcAudio', JSON.stringify(this.on)); } catch (e) {} },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 6; this.comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = .85; this.master.connect(this.comp);
    this.sfx = c.createGain(); this.sfx.gain.value = this.on.sfx ? .6 : 0; this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = this.on.music ? .32 : 0; this.mus.connect(this.master);
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    this.delay = c.createDelay(1); this.delay.delayTime.value = .33;
    const fb = c.createGain(); fb.gain.value = .35; this.delay.connect(fb); fb.connect(this.delay);
    const wet = c.createGain(); wet.gain.value = .4; this.delay.connect(wet); wet.connect(this.mus);
    this.nextT = c.currentTime + .1;
    setInterval(() => this.schedule(), 25);
  },
  setOn(k, v) {
    this.on[k] = v; this.save();
    if (this.ctx) (k === 'music' ? this.mus : this.sfx).gain.setTargetAtTime(v ? (k === 'music' ? .32 : .6) : 0, this.ctx.currentTime, .05);
  },
  // --- primitives
  tone(f, dur, o = {}) {
    const c = this.ctx, t = o.at || c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol || .2, a = o.a || .004;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    let node = osc;
    if (o.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; f2.Q.value = o.q || 1; node.connect(f2); node = f2; }
    node.connect(g); g.connect(o.dest || this.sfx);
    if (o.send) g.connect(this.delay);
    osc.start(t); osc.stop(t + dur + .02);
  },
  noise(dur, o = {}) {
    const c = this.ctx, t = o.at || c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = c.createGain(), v = o.vol || .2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + (o.a || .003)); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * .5); src.stop(t + dur + .02);
  },
  // --- sound effects (throttled so hundreds of hits don't turn into mush)
  play(name, p = 1) {
    if (!this.ctx || !this.on.sfx) return;
    const now = this.ctx.currentTime, gap = { swing: .07, hit_red: .05, hit_blue: .05, hit_yellow: .05, hit_green: .05, boom: .06, zap: .05, freeze: .08, coin: .06, xp: .045, thorn: .07, rumble: .08, pop: .04, summon: .12, burn: .25 }[name] || 0;
    if (gap && now - (this.last[name] || 0) < gap) return;
    this.last[name] = now;
    const T = this.tone.bind(this), N = this.noise.bind(this);
    switch (name) {
      case 'swing': N(.08, { ft: 'bandpass', f: 1400, to: 500, q: 1.5, vol: .05 }); break;
      case 'hit_red': N(.08, { f: 900, vol: .1 }); T(150, .07, { vol: .08, to: 80 }); break;
      case 'hit_blue': T(1800 + Math.random() * 400, .06, { type: 'triangle', vol: .05 }); T(2700, .04, { vol: .03 }); break;
      case 'hit_yellow': T(1000, .05, { type: 'square', to: 300, vol: .03 }); break;
      case 'hit_green': T(330, .08, { type: 'triangle', vol: .06, to: 260 }); break;
      case 'boom': N(.35 * p, { f: 700, to: 90, vol: .22 * p }); T(110, .3 * p, { vol: .28 * p, to: 35 }); break;
      case 'zap': T(1300 + Math.random() * 500, .12, { type: 'sawtooth', to: 180, vol: .05, lp: 4000 }); N(.06, { ft: 'highpass', f: 3000, vol: .08 }); break;
      case 'freeze': [0, .03, .06].forEach((d, i) => T(1500 + i * 520, .14, { type: 'triangle', vol: .04, at: this.ctx.currentTime + d })); break;
      case 'rumble': N(.5 * p, { f: 260, to: 70, vol: .2 * Math.min(1.5, p) }); T(62, .45 * p, { vol: .22 * Math.min(1.5, p), to: 38 }); break;
      case 'thorn': T(1500, .05, { type: 'square', vol: .025, to: 700 }); N(.05, { ft: 'highpass', f: 4000, vol: .05 }); break;
      case 'event': T(660, .12, { type: 'triangle', vol: .06 }); T(990, .2, { type: 'triangle', vol: .05, at: now + .1, send: true }); break;
      case 'xp': T(900 + Math.random() * 300, .05, { type: 'triangle', vol: .025 }); break;
      case 'coin': T(1320, .05, { vol: .035 }); T(1760, .06, { vol: .03, at: now + .045 }); break;
      case 'pop': T(420, .06, { vol: .04, to: 110 }); break;
      case 'burn': N(.25, { f: 2500, ft: 'bandpass', vol: .04 }); break;
      case 'summon': T(480, .09, { vol: .05, to: 900, type: 'triangle' }); break;
      case 'hurt': T(170, .16, { type: 'square', to: 60, vol: .12, lp: 900 }); N(.1, { f: 600, vol: .12 }); break;
      case 'level': [69, 72, 76, 81].forEach((m, i) => T(mtof(m), .18, { type: 'triangle', vol: .08, at: now + i * .07, send: true })); break;
      case 'buy': T(880, .06, { vol: .06 }); T(1320, .1, { vol: .05, at: now + .06 }); break;
      case 'click': T(700, .03, { vol: .04 }); break;
      case 'whoosh': N(.3, { ft: 'bandpass', f: 300, to: 1600, q: 2, vol: .1 }); break;
      case 'flame': N(.9, { f: 1600, to: 600, vol: .09, a: .05 }); break;
      case 'gust': N(.45, { ft: 'bandpass', f: 700, to: 2600, q: 1.2, vol: .1, a: .05 }); break;
      case 'snap': N(.5, { ft: 'highpass', f: 2000, vol: .1 }); [88, 91, 95].forEach((m, i) => T(mtof(m), .4, { type: 'triangle', vol: .04, at: now + i * .02 })); break;
      case 'revive': T(200, .7, { type: 'sawtooth', to: 900, vol: .1, lp: 2500 }); N(.6, { f: 600, to: 3000, vol: .08 }); break;
      case 'wave': T(110, .7, { type: 'sawtooth', vol: .07, lp: 700, a: .05 }); T(165, .7, { type: 'sawtooth', vol: .05, lp: 700, a: .05 }); break;
      case 'boss': [55, 58].forEach(m => T(mtof(m - 12), 1.6, { type: 'sawtooth', vol: .12, lp: 500, a: .1 })); N(1.4, { f: 200, to: 1200, vol: .1, a: .3 }); break;
      case 'endless': T(mtof(33), 2.2, { type: 'sawtooth', vol: .1, lp: 300, a: .3 }); T(mtof(34), 2.2, { type: 'sawtooth', vol: .1, lp: 300, a: .3 }); N(2, { ft: 'bandpass', f: 4000, to: 300, vol: .06, a: .8 }); break;
      case 'crit': T(1900, .05, { type: 'triangle', vol: .04 }); T(2600, .07, { vol: .03, at: now + .03 }); break;
      case 'relic': [57, 64, 69, 76].forEach((m, i) => T(mtof(m), .5, { type: 'triangle', vol: .08, at: now + i * .09, send: true })); break;
      case 'evolve': T(110, .9, { type: 'sawtooth', to: 880, vol: .1, lp: 3000 }); [72, 76, 79, 84].forEach((m, i) => T(mtof(m), .4, { type: 'triangle', vol: .07, at: now + .5 + i * .06, send: true })); break;
      case 'tele': T(300, .25, { type: 'square', vol: .04, to: 600, lp: 1500 }); break;
      case 'death': T(220, 1.4, { type: 'sawtooth', to: 40, vol: .12, lp: 1200 }); N(1, { f: 400, to: 60, vol: .1 }); break;

  // --- music
  setMode(m) {
    if (m === this.mode) return;
    this.mode = m; this.step = 0;
    if (this.ctx) this.nextT = Math.max(this.nextT, this.ctx.currentTime + .05);
  },
  bpm() { return { calm: 76, fight: 112, boss: 142, endless: Math.min(150, 98 + (this.wave - 21) * 4) }[this.mode] || 100; },
  schedule() {
    if (!this.ctx || !this.mode) return;
    while (this.nextT < this.ctx.currentTime + .15) {
      if (this.on.music) this.playStep(this.step, this.nextT);
      this.nextT += 60 / this.bpm() / 4; this.step++;
    }
  },
  kick(t, v = .5) { this.tone(150, .22, { to: 40, vol: v, at: t, dest: this.mus }); },
  snare(t, v = .18) { this.noise(.14, { ft: 'bandpass', f: 1800, q: .8, vol: v, at: t, dest: this.mus }); this.tone(220, .08, { vol: v * .5, at: t, dest: this.mus, to: 140 }); },
  hat(t, v = .05) { this.noise(.04, { ft: 'highpass', f: 7000, vol: v, at: t, dest: this.mus }); },
  playStep(s, t) {
    const M = this.mus, b = s % 16, bar = Math.floor(s / 16), T = this.tone.bind(this);
    if (this.mode === 'calm') {
      const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]][bar % 4];
      if (b === 0) prog.forEach(m => T(mtof(m - 12), 3.4, { type: 'triangle', vol: .05, a: .8, at: t, dest: M, lp: 1200 }));
      if (b % 2 === 0 && Math.random() < .55) T(mtof(pick(prog) + 12), .5, { vol: .035, at: t, dest: M, send: true });
    } else if (this.mode === 'fight') {
      const root = [45, 41, 43, 40][bar % 4], chord = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]][bar % 4];
      if (b === 0 || b === 8 || (b === 10 && bar % 2)) this.kick(t, .45);
      if (b === 4 || b === 12) this.snare(t);
      if (b % 2 === 1) this.hat(t);
      if ([0, 3, 6, 8, 11, 14].includes(b)) T(mtof(root - 12), .2, { type: 'sawtooth', vol: .1, at: t, dest: M, lp: 500, q: 4 });
      if (b % 2 === 0) T(mtof(chord[(b / 2) % 3] + 12), .14, { type: 'square', vol: .02, at: t, dest: M, lp: 2200, send: true });
      if (b === 0) chord.forEach(m => T(mtof(m), 2, { type: 'triangle', vol: .025, a: .4, at: t, dest: M }));
    } else if (this.mode === 'boss') {
      const root = [45, 46, 45, 40][bar % 4];
      if (b % 4 === 0) this.kick(t, .55);
      if (b === 4 || b === 12) this.snare(t, .22);
      this.hat(t, b % 2 ? .05 : .03);
      T(mtof(root - 12 + (b % 2 ? 12 : 0)), .12, { type: 'square', vol: .07, at: t, dest: M, lp: 900, q: 6 });
      if (b === 0 || b === 6 || b === 10) [0, 3, 7].forEach(i => T(mtof(root + 12 + i), .16, { type: 'sawtooth', vol: .035, at: t, dest: M, lp: 2500 }));
      if (b === 0 && bar % 4 === 3) this.noise(1.6, { ft: 'bandpass', f: 400, to: 5000, vol: .07, a: 1.4, at: t, dest: M });
    } else if (this.mode === 'endless') {
      const n = this.wave - 20;
      // heartbeat
      if (b === 0) this.kick(t, .6);
      if (b === 2) this.kick(t, .4);
      if (n >= 3 && (b === 8)) this.kick(t, .5);
      if (n >= 3 && (b === 10)) this.kick(t, .3);
      // clock tick
      if (b % 4 === 0) T(3200, .02, { type: 'square', vol: .02, at: t, dest: M });
      if (n >= 2 && b % 2 === 1) this.hat(t, .03);
      if (n >= 5) this.hat(t, .02);
      // dissonant drone every bar
      if (b === 0) { T(mtof(33), 2.6, { type: 'sawtooth', vol: .06, a: .6, at: t, dest: M, lp: 260 }); T(mtof(34), 2.6, { type: 'sawtooth', vol: .05, a: .6, at: t, dest: M, lp: 260 }); }
      // tritone pulse
      if (b % 8 === 0) T(mtof(b === 0 ? 45 : 51) - 0, .4, { type: 'square', vol: .05, at: t, dest: M, lp: 700, q: 8 });
      // glassy diminished notes, echoed
      if (b % 2 === 0 && Math.random() < .2 + Math.min(.3, n * .03)) T(mtof(pick([81, 84, 87, 90, 93])), .7, { vol: .03, at: t, dest: M, send: true });
      if (b === 0 && bar % 4 === 3) this.noise(2.2, { ft: 'bandpass', f: 200, to: 6000, vol: .06, a: 2, at: t, dest: M });
    }
  },
};

function hpMult(w) { const k = Math.max(0, Math.min(w, 20) - 6); let m = 1 + (w - 1) * .6 + k * k * .12; if (w > 20) m *= Math.pow(1.31, w - 20); return m; }
function dmgMult(w) { const k = Math.max(0, Math.min(w, 20) - 8); let m = 1 + (w - 1) * .16 + k * k * .025; if (w > 20) m *= Math.pow(1.16, w - 20); return m; }
function spdMult(w) { return (1 + Math.min(.4, w * .012)) * (w > 20 ? Math.min(2.4, 1 + (w - 20) * .07) : 1); }
// armor is a % reduction for everyone: armor / (armor + ARM_K). 25 armor = 33% less damage, 50 = 50%, 100 = 67%.
const ARM_K = 50;
const armRed = a => a > 0 ? ARM_K / (ARM_K + a) : 1;   // damage multiplier left after armor
function armorAt(w) { let a = Math.floor(Math.max(0, w - 4) * .45); if (w > 20) { const n = w - 20; a += Math.floor(1.5 * n + .18 * n * n); } return a; }
function waveCount(w) { return Math.round(14 + w * 6 + (w > 20 ? (w - 20) * 12 : 0)); }
function enemyPool(w) {
  const l = [['grunt', 5]];
  if (w >= 2) l.push(['runner', 2.5 + w * .1]);
  if (w >= 3) l.push(['swarm', 1.2]);
  if (w >= 4) l.push(['brute', .8 + w * .12]);
  if (w >= 7) l.push(['charger', 1 + w * .06]);
  return l;
}

      }

    }
    const held = e.frozen > 0 || e.stun > 0;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    let vx = dx / d, vy = dy / d;
    let sm = (e.chill > 0 ? 1 - slow : 1) * ((ff || syn('frostfire2') >= 0) && e.burnT > 0 ? .7 : 1);
    let sp = held ? 0 : e.spd * sm * (altarOn && !e.special ? 1.35 : 1);
    if (e.fixed) {   // altars and eggs never move

    } else if (e.type === 'charger') {

      else if (e.mode === 'walk' && e.dashCd <= 0 && d < 240 && Math.hypot(e.x, e.y) < R + 10) { e.mode = 'wind'; e.modeT = .5; }

    e.kx *= Math.max(0, 1 - dt * 12); e.ky *= Math.max(0, 1 - dt * 12);
    const far = Math.hypot(e.x, e.y); if (far > SPAWN_R + 40) { e.x *= (SPAWN_R + 40) / far; e.y *= (SPAWN_R + 40) / far; }   // nothing gets lost outside

// ---- arena events
function scheduleEvents() {

  const n = (Math.random() < .75 ? 1 : 0) + (S.wave >= 8 && Math.random() < .45 ? 1 : 0) + (S.wave >= 16 && Math.random() < .35 ? 1 : 0);
  const pool = [['shrine', 3], ['goblin', 2], ['spring', 1.4], ['cache', 2]];
  if (S.wave >= 7) pool.push(['elite', 1.5]);
  if (S.wave >= 6) pool.push(['altar', 1.2]);
  for (let i = 0; i < n; i++) S.sched.push({ t: rnd(4, 14) + i * 5, type: pickW(pool) });
}
function arenaSpot(minD) {

}
function triggerEvent(type) {

  else if (type === 'spring') { S.evs.push({ k: 'spring', ...arenaSpot(60), life: 9, r: 42 }); msg = 'A healing spring bubbles up'; }
  else if (type === 'cache') { S.evs.push({ k: 'cache', ...arenaSpot(90), life: 15 }); msg = 'A supply cache crashed down!'; }
  else if (type === 'goblin') { const a = Math.random() * TAU; spawnEnemy('goblin', Math.cos(a) * (R - 30), Math.sin(a) * (R - 30)); msg = 'A treasure goblin! Catch it before it escapes'; }
  else if (type === 'elite') {
    const e = spawnEnemy(pick(S.wave >= 7 ? ['grunt', 'brute', 'charger', 'runner'] : ['grunt', 'brute', 'runner']));

    msg = 'An elite enemy has entered the circle';

  banner(msg, true);

}
function updEvents(dt) {

      else ev.prog = Math.max(0, ev.prog - dt * .5);

function drawOverlay(c, T, endless, bossOn) {

const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setWidth(id, f) { const v = Math.round(clamp(f, 0, 1) * 200) / 2 + '%'; if (hudCache[id + 'w'] !== v) { hudCache[id + 'w'] = v; $(id).style.width = v; } }
function updateHud() {
  if (!S) return;
  setWidth('hpB', S.p.hp / tot.maxHp); setText('hpT', `${Math.ceil(Math.max(0, S.p.hp))} / ${Math.round(tot.maxHp)}`);

// ---- one click handler for every button in every menu
function act(a, arg) {
  if (a === 'stab') { UI.stab = arg; renderStart(); return; }
  if (a === 'audio') { AU.setOn(arg, !AU.on[arg]); if (S && paused) renderPause(); else renderStart(); return; }
  if (a === 'start') { const st = pendingRun.starters[+arg]; newRun(st); pendingRun = null; return; }
  if (a === 'reroll-run') { sfx('click'); pendingRun = rollRun(); renderStart(); return; }
  if (a === 'continue') { const d = loadSave(); if (d) { pendingRun = null; resumeRun(d); } return; }
  if (a === 'update') { applyUpdate(); return; }
  if (a === 'restart' || a === 'quit') { paused = false; S = null; showHud(false); UI.stab = 'play'; renderStart(); return; }
  if (!S) return;
  if (a === 'ptab') { UI.ptab = arg; renderPause(); return; }
  if (a === 'runstats') { sfx('click'); UI.rtab = arg || 'high'; renderRunStats(); return; }
  if (a === 'deadback') { sfx('click'); renderDead(); return; }
  if (a === 'resume') { togglePause(); return; }
  if (a === 'tab') { UI.tab = arg; renderShop(); return; }
  if (a === 'perk') { choosePerk(+arg); return; }
  if (a === 'relic') { takeRelic(arg); return; }
  if (a === 'lvreroll') { if (S.lvRerolls > 0) { S.lvRerolls--; sfx('click'); S.lockedCards = S.perkOffer.filter(c => c.locked).map(c => ({ ...c, locked: false })); S.perkOffer = rollLevelCards(); renderLevelUp(); } return; }
  if (a === 'lvlock') { const c = S.perkOffer[+arg]; if (c) { c.locked = !c.locked; sfx('click'); renderLevelUp(); } return; }
  if (S.phase !== 'shop') return;
  const g = S.gold;
  if (a === 'next') { startWave(); return; }
  if (a === 'reroll') { if (g < S.rerollCost) return; sfx('click'); S.gold -= S.rerollCost; S.rerolls++; S.rs.rerolls++; S.rerollCost = rerollPrice(); S.offers = rollOffers(); S.shopLocked = false; }
  else if (a === 'lock') { S.shopLocked = !S.shopLocked; sfx('click'); }
  else if (a === 'buylvr') { const pr = lvRerollPrice(); if (g < pr) return; S.gold -= pr; S.lvRerollBuys++; sfx('buy'); }
  else if (a === 'xp') { const amt = Math.floor(Math.floor(g) * +arg); if (amt < 2) return; S.gold -= amt; gainXp(amt * GOLD_TO_XP); sfx('level'); if (S.pendingLv > 0) { nextMenu(); return; } }
  else if (a === 'buy') { const o = S.offers[+arg]; if (!o || S.weapons.length >= 6 || g < priceOf(o.tier)) return; sfx('buy'); S.gold -= priceOf(o.tier); S.offers[+arg] = null; S.rs.bought++; addWeapon(o); }
  else {
    const w = S.weapons.find(w => w.id === +arg); if (!w) return;
    if (a === 'up') { if (w.tier >= 3 || g < upCost(w.tier)) return; sfx('buy'); S.gold -= upCost(w.tier); w.tier++; recalc(); }
    else if (a === 'evo') { if (!canEvolve(w) || g < evoCost()) return; S.gold -= evoCost(); w.evo = true; w.fused = false; sfx('evolve'); recalc(); }
    else if (a === 'fuse') { if (!canFuse(w) || g < evoCost()) return; S.gold -= evoCost(); w.fused = true; sfx('evolve'); recalc(); }
    else if (a === 'sell') { if (S.weapons.length <= 1) return; sfx('coin'); S.gold += sellVal(w); S.weapons = S.weapons.filter(x => x !== w); recalc(); }
    else return;
  }
  renderShop();
}

// ===== input, in-app updates, main loop, boot

// ---- in-app updates: the installed app checks GitHub for a newer game and can install it in place
const UPDATE_BASE = 'https://raw.githubusercontent.com/Darkz94/last-circle/main/';
const IS_APP = !!window.Capacitor;
let updateInfo = null, updateChecked = false, updating = false;
function checkUpdate() {
  if (!IS_APP || updateChecked || typeof fetch !== 'function') return;
  updateChecked = true;
  fetch(UPDATE_BASE + 'version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(v => {
    if (v && v.version > GAME_VERSION) { updateInfo = v; if (!S) renderStart(); }
  }).catch(() => {});
}
async function applyUpdate() {
  if (updating) return;
  updating = true; renderStart();
  try {
    const html = await (await fetch(UPDATE_BASE + 'game.html?t=' + Date.now(), { cache: 'no-store' })).text();
    const m = html.match(/const GAME_VERSION = (\d+);/);
    if (!m || +m[1] <= GAME_VERSION) throw new Error('not newer');
    localStorage.setItem('lcOta', JSON.stringify({ v: +m[1], html }));
    location.reload();
  } catch (e) { updating = false; updateInfo.err = true; renderStart(); }
}

// ---- input
addEventListener('keydown', e => {
  AU.init();
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (k === 'm') AU.setOn('music', !AU.on.music);
  if (k === 'n') AU.setOn('sfx', !AU.on.sfx);
  if (!S) return;
  if (k === 'p' || k === 'escape') togglePause();
  if (S.phase === 'levelup' && ['1', '2', '3'].includes(k)) choosePerk(+k - 1);
  if (S.phase === 'levelup' && k === 'r') act('lvreroll');
  if (S.phase === 'shop' && k === 'enter') startWave();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('pointerdown', () => AU.init(), true);
addEventListener('blur', () => { keys.clear(); if (S && S.phase === 'fight' && !paused) togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.phase === 'fight' && !paused) togglePause(); });
cv.addEventListener('pointerdown', e => { joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (e.pointerId === joy.id) joy.on = false; };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
$('pauseBtn').addEventListener('click', () => togglePause());
screen.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  AU.init();
  const i = b.dataset.act.indexOf(':');
  if (i < 0) act(b.dataset.act); else act(b.dataset.act.slice(0, i), b.dataset.act.slice(i + 1));
});
addEventListener('resize', resize);

// ---- main loop: the simulation always advances in fixed 1/60s steps, however fast the screen refreshes
let last = performance.now(), acc = 0;
function loop(now) {
  const ft = Math.min(.1, (now - last) / 1000); last = now;
  if (S && S.phase === 'fight' && !paused) {
    acc += ft;
    let n = 0;
    while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; if (!S || S.phase !== 'fight') break; }
    if (n === 4) acc = 0;
  } else acc = 0;
  AU.setMode(musicMode());
  draw();
  updateHud();
  requestAnimationFrame(loop);
}
function TEST_API() {
  return { get S() { return S; }, get pendingRun() { return pendingRun; }, set pendingRun(v) { pendingRun = v; }, tot, UI, AB, ABIL, RELICS, STAT, TYPES, CODEX,
    rollRun, newRun, resumeRun, loadSave, saveRun, step, draw, act, keys, makeWeapon, addWeapon, recalc, triggerEvent, nextMenu, startWave, choosePerk, takeRelic,
    SYN, BOSSES, spawnBoss, bossKeyFor, syn, priceOf, upCost, evoCost, canEvolve, canFuse, lvRerollPrice, E, sv, renderShop, renderStart, renderPause, musicMode, updateHud, nearest, setGold(v) { GOLD_RATE = v; }, setReroll(f) { RRF = f; } };
}
resize();
requestAnimationFrame(loop);
renderStart();
renderSlots();

})();
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
